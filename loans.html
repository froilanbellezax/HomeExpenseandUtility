<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans & Installments - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-indigo-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">🏦 Loans & Installments</h1>
    <button onclick="location.href='index.html'" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white p-4 rounded-2xl shadow-md border border-indigo-700 space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-indigo-200 uppercase">📅 This Month's Loan Dues</span>
        <span id="currentMonthBadge" class="text-[10px] bg-indigo-700 px-2 py-0.5 rounded-full font-bold">---</span>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-1">
        <div class="bg-white/10 p-2.5 rounded-xl">
          <span class="text-[10px] text-amber-300 block font-semibold">Unpaid Due This Month:</span>
          <span id="loanDueThisMonth" class="text-lg font-extrabold text-amber-400">₱0.00</span>
        </div>
        <div class="bg-white/10 p-2.5 rounded-xl">
          <span class="text-[10px] text-indigo-200 block font-semibold">Total Remaining Balance:</span>
          <span id="loanTotalRemaining" class="text-lg font-extrabold text-white">₱0.00</span>
        </div>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Add Loan / Installment</h2>
      <form id="loanForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Loan Provider / App</label>
            <input type="text" id="loanProvider" required placeholder="e.g. SPayLater" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Item / Description</label>
            <input type="text" id="loanItemDesc" required placeholder="e.g. Oven, Phone" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Account Holder</label>
            <select id="loanHolder" class="w-full p-2.5 border rounded-xl text-sm outline-none loan-profile-select"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Actual Payer</label>
            <select id="loanPayer" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-indigo-700 loan-profile-select" onchange="checkCustomPayer()"></select>
            <input type="text" id="loanCustomPayer" placeholder="Enter Payer Name" class="w-full p-2 border rounded-xl text-xs outline-none mt-1 hidden">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Monthly Due (₱)</label>
            <input type="number" step="0.01" id="loanMonthly" required placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Start Month</label>
            <select id="loanStartMonth" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-indigo-700"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Total Term (Mos)</label>
            <input type="number" id="loanTotalMonths" required placeholder="12" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Already Paid (Mos)</label>
            <input type="number" id="loanMonthsPaid" value="0" min="0" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Due Day / Schedule Notes</label>
          <input type="text" id="loanDueDay" placeholder="e.g. Every 15th" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">Save Installment Plan</button>
      </form>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Installment Tracker & Progress</h3>
      <div id="loansList" class="space-y-3 text-sm">
        <p class="text-gray-400 text-center">Loading loans...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    function getCurrentMonthStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }
    function getCurrentMonthLabel() {
      return new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    async function fetchLoansData() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          populateProfileDropdowns(json.data.profiles || []);
          renderLoans(json.data.loans || []);
        }
      } catch (e) {
        console.error("Failed to load loans:", e);
      }
    }

    function populateProfileDropdowns(profiles) {
      const loanSelects = document.querySelectorAll('.loan-profile-select');
      let options = profiles.length 
        ? profiles.map(p => `<option value="${p.name}">${p.name}</option>`).join('')
        : `<option value="${currentUser}">${currentUser}</option>`;
      const payerOptions = options + `<option value="Others">🌐 Others (Custom Name)</option>`;

      loanSelects.forEach(s => {
        s.innerHTML = (s.id === 'loanPayer') ? payerOptions : options;
        if (currentUser) s.value = currentUser;
      });

      const select = document.getElementById('loanStartMonth');
      if (select) {
        let optHtml = '';
        const now = new Date();
        for (let i = -24; i <= 12; i++) {
          const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
          const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          const label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
          optHtml += `<option value="${val}" ${i === 0 ? 'selected' : ''}>${label}</option>`;
        }
        select.innerHTML = optHtml;
      }
    }

    function checkCustomPayer() {
      const sel = document.getElementById('loanPayer');
      const customInput = document.getElementById('loanCustomPayer');
      if (sel.value === 'Others') {
        customInput.classList.remove('hidden');
        customInput.required = true;
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
        customInput.value = '';
      }
    }

    function renderLoans(data) {
      const container = document.getElementById('loansList');
      const currMonth = getCurrentMonthStr();
      document.getElementById('currentMonthBadge').innerText = getCurrentMonthLabel();

      let dueThisMonth = 0;
      let totalRemaining = 0;

      if (!data || !data.length) {
        container.innerHTML = '<p class="text-gray-400 text-center">No active loans found.</p>';
        document.getElementById('loanDueThisMonth').innerText = "₱0.00";
        document.getElementById('loanTotalRemaining').innerText = "₱0.00";
        return;
      }

      container.innerHTML = data.map(l => {
        const monthly = parseFloat(l.monthlydue) || 0;
        const totalM = parseInt(l.totalmonths) || 1;
        const paidM = parseInt(l.monthspaid) || 0;
        const remM = Math.max(0, totalM - paidM);
        const remBalance = remM * monthly;
        const progressPct = Math.min(100, Math.round((paidM / totalM) * 100));
        const startM = l.startmonth || currMonth;
        
        const isStarted = currMonth >= startM;
        const isPaidThisMonth = String(l.lastpaidmonth) === currMonth || remM === 0;
        const loanStatus = l.status || 'Active';
        const provider = l.loanprovider || 'Loan';
        const desc = l.itemdescription || '';
        const holder = l.accountholder || '';
        const payer = l.actualpayer || '';

        const isHolder = holder.toLowerCase() === currentUser.toLowerCase();
        const isPayer = payer.toLowerCase() === currentUser.toLowerCase();
        const isAdmin = currentUser.toLowerCase() === 'froilan' || currentUser.toLowerCase() === 'admin';

        if (remM > 0) {
          totalRemaining += remBalance;
          if (isStarted && !isPaidThisMonth && loanStatus !== 'Pending Approval') {
            dueThisMonth += monthly;
          }
        }

        let actionButtonHTML = '';
        if (remM > 0) {
          if (!isStarted) {
            actionButtonHTML = `<div class="text-center text-xs bg-amber-50 text-amber-800 py-1.5 rounded-xl font-bold border border-amber-200">⏳ Upcoming (Starts on ${startM})</div>`;
          } else if (isPaidThisMonth) {
            actionButtonHTML = `<div class="text-center text-xs bg-green-100 text-green-800 py-1.5 rounded-xl font-bold">✅ Paid for ${getCurrentMonthLabel()}</div>`;
          } else {
            if (isPayer || isHolder || isAdmin) {
              actionButtonHTML = `<button onclick="payLoanMonth('${l.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-xl transition shadow-sm">✅ Mark ${getCurrentMonthLabel()} as Paid</button>`;
            } else {
              actionButtonHTML = `<div class="text-center text-xs bg-gray-100 text-gray-500 py-1.5 rounded-xl font-semibold">Viewing only</div>`;
            }
          }
        }

        return `
          <div class="p-3.5 bg-indigo-50/60 rounded-2xl border border-indigo-100 space-y-2.5">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded font-bold uppercase">${provider}</span>
                  <span class="font-bold text-indigo-950 text-sm">${desc || provider}</span>
                </div>
                <div class="text-[11px] text-gray-600 mt-1">
                  Account: <strong>${holder}</strong> • Payer: <span class="bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded font-bold">${payer}</span>
                </div>
              </div>
              <div class="text-right">
                <div class="font-extrabold text-indigo-700 text-base">₱${monthly.toFixed(2)}<span class="text-[10px] font-normal text-gray-500">/mo</span></div>
                <div class="text-[10px] font-bold ${remM === 0 ? 'text-green-600' : 'text-amber-600'}">
                  ${remM === 0 ? '🎉 Fully Paid!' : `${remM} mos left (₱${remBalance.toFixed(2)})`}
                </div>
              </div>
            </div>
            <div>
              <div class="flex justify-between text-[10px] font-semibold text-gray-500 mb-1">
                <span>Paid: ${paidM} / ${totalM} months</span>
                <span>${progressPct}%</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                <div class="bg-indigo-600 h-2 rounded-full transition-all" style="width: ${progressPct}%"></div>
              </div>
            </div>
            ${actionButtonHTML}
          </div>
        `;
      }).join('');

      document.getElementById('loanDueThisMonth').innerText = `₱${dueThisMonth.toFixed(2)}`;
      document.getElementById('loanTotalRemaining').innerText = `₱${totalRemaining.toFixed(2)}`;
    }

    async function payLoanMonth(id) {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "payLoanMonth", id: id, actor: currentUser })
      });
      alert("Marked as paid!");
      setTimeout(fetchLoansData, 1500);
    }

    document.getElementById('loanForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payerSelect = document.getElementById('loanPayer').value;
      const customPayer = document.getElementById('loanCustomPayer').value.trim();
      const finalPayer = payerSelect === 'Others' ? customPayer : payerSelect;

      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addLoan",
          loanProvider: document.getElementById('loanProvider').value,
          itemDesc: document.getElementById('loanItemDesc').value,
          holder: document.getElementById('loanHolder').value,
          payer: finalPayer,
          monthlyDue: document.getElementById('loanMonthly').value,
          startMonth: document.getElementById('loanStartMonth').value,
          dueDay: document.getElementById('loanDueDay').value,
          totalMonths: document.getElementById('loanTotalMonths').value,
          monthsPaid: document.getElementById('loanMonthsPaid').value,
          currentMonthStr: getCurrentMonthStr(),
          actor: currentUser
        })
      });
      alert("Loan saved successfully!");
      document.getElementById('loanForm').reset();
      setTimeout(fetchLoansData, 1500);
    });

    fetchLoansData();
  </script>
</body>
</html>
