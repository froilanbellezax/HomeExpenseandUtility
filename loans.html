<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans & Installments - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-indigo-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">🏦 Loans & Installments</h1>
    <button onclick="location.href='index.html'" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <!-- OVERALL SUMMARY CARD -->
    <div class="bg-gradient-to-r from-indigo-900 to-blue-900 text-white p-4 rounded-2xl shadow-md border border-indigo-700">
      <div class="text-xs font-bold text-indigo-200 uppercase mb-2">📊 Overall Loans & BNPL Summary</div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-indigo-800/50 p-2.5 rounded-xl border border-indigo-700/40">
          <span class="text-[10px] text-gray-300 block font-semibold">Total Obligation</span>
          <span id="sumTotal" class="font-bold text-white text-xs">₱0.00</span>
        </div>
        <div class="bg-indigo-800/50 p-2.5 rounded-xl border border-indigo-700/40">
          <span class="text-[10px] text-green-300 block font-semibold">Total Paid</span>
          <span id="sumPaid" class="font-bold text-green-400 text-xs">₱0.00</span>
        </div>
        <div class="bg-indigo-800/50 p-2.5 rounded-xl border border-indigo-700/40">
          <span class="text-[10px] text-amber-300 block font-semibold">Remaining Balance</span>
          <span id="sumRemaining" class="font-bold text-amber-400 text-xs">₱0.00</span>
        </div>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Add New Loan / Installment</h2>
      <form id="loanForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Provider</label>
            <input type="text" id="loanProvider" required placeholder="e.g. SPayLater, Home Credit" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Item / Description</label>
            <input type="text" id="itemDesc" required placeholder="e.g. Phone accessory" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Account Holder</label>
            <select id="accHolder" class="w-full p-2.5 border rounded-xl text-sm outline-none loan-profile-select"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Actual Payer</label>
            <select id="actualPayer" class="w-full p-2.5 border rounded-xl text-sm outline-none loan-profile-select"></select>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Monthly Due (₱)</label>
            <input type="number" step="0.01" id="monthlyDue" required placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Total Months</label>
            <input type="number" id="totalMonths" required value="3" class="w-full p-2.5 border rounded-xl text-sm outline-none text-center">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Due Day</label>
            <input type="text" id="dueDay" placeholder="e.g. 15th" value="15th" class="w-full p-2.5 border rounded-xl text-sm outline-none text-center">
          </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-md">Save Loan Record</button>
      </form>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-gray-700 text-xs uppercase">📋 Active Loans & Installments</h3>
        <span id="loanCountBadge" class="text-[10px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full font-bold">0 Active</span>
      </div>

      <!-- Consolidated Action Panel -->
      <div id="consolidatedActionBox" class="hidden p-3 bg-indigo-50 border border-indigo-200 rounded-xl flex justify-between items-center">
        <span id="selectedCountText" class="text-xs font-semibold text-indigo-900">0 selected</span>
        <button onclick="paySelectedLoans()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition">
          Pay Selected (Consolidated)
        </button>
      </div>

      <div id="loansList" class="space-y-3 text-sm">
        <p class="text-gray-400 text-center py-2">Loading loans...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";
    let allLoansData = [];

    async function fetchLoansData() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          const profiles = json.data.profiles || [];
          document.querySelectorAll('.loan-profile-select').forEach(select => {
            select.innerHTML = profiles.map(p => `<option value="${p.name}" ${p.name === currentUser ? 'selected' : ''}>${p.name}</option>`).join('');
          });
          allLoansData = json.data.loans || [];
          renderLoans(allLoansData);
        }
      } catch (e) {
        console.error("Failed to fetch loans:", e);
      }
    }

    function renderLoans(loans) {
      const container = document.getElementById('loansList');
      if (!loans.length) { 
        container.innerHTML = '<p class="text-gray-400 text-center py-2">No loans recorded.</p>'; 
        document.getElementById('sumTotal').innerText = '₱0.00';
        document.getElementById('sumPaid').innerText = '₱0.00';
        document.getElementById('sumRemaining').innerText = '₱0.00';
        document.getElementById('loanCountBadge').innerText = '0 Active';
        return; 
      }

      let grandTotal = 0;
      let grandPaid = 0;
      let grandRemaining = 0;
      let activeCount = 0;

      // --- SORTING LOGIC ---
      // 1. Active muna bago Pending / Completed
      // 2. Kung parehong Active, i-sort base sa due day (pinakamalapit sa unahan)
      const sortedLoans = [...loans].sort((a, b) => {
        const statusA = String(a.status || 'Active').toLowerCase();
        const statusB = String(b.status || 'Active').toLowerCase();
        
        if (statusA === 'active' && statusB !== 'active') return -1;
        if (statusA !== 'active' && statusB === 'active') return 1;

        const dayA = parseInt(String(a.dueday || '').replace(/\D/g, '')) || 99;
        const dayB = parseInt(String(b.dueday || '').replace(/\D/g, '')) || 99;
        return dayA - dayB;
      });

      container.innerHTML = sortedLoans.map(l => {
        const monthly = parseFloat(l.monthlydue || 0);
        const totalM = parseInt(l.totalmonths || 1);
        const paidM = parseInt(l.monthspaid || 0);
        const remM = Math.max(0, totalM - paidM);
        
        const totalObligation = monthly * totalM;
        const totalPaidAmt = monthly * paidM;
        const remainingBal = monthly * remM;

        if (String(l.status || 'Active').toLowerCase() === 'active' && remM > 0) {
          grandTotal += totalObligation;
          grandPaid += totalPaidAmt;
          grandRemaining += remainingBal;
          activeCount++;
        }

        const progressPercent = Math.min(100, Math.round((paidM / totalM) * 100));
        const isCompleted = remM === 0 || String(l.status || '').toLowerCase() === 'completed';
        const isPending = String(l.status || '').toLowerCase() === 'pending approval';

        let badgeHtml = `<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">Active</span>`;
        if (isCompleted) {
          badgeHtml = `<span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full font-bold">Completed</span>`;
        } else if (isPending) {
          badgeHtml = `<span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">Pending</span>`;
        }

        return `
          <div class="p-3.5 bg-gray-50/80 rounded-2xl border border-gray-200 space-y-2">
            <div class="flex justify-between items-start">
              <div class="flex items-start gap-2">
                ${!isCompleted && !isPending ? `
                  <input type="checkbox" value="${l.id}" onchange="updateSelectedCount()" class="loan-checkbox mt-1 rounded text-indigo-600">
                ` : ''}
                <div>
                  <div class="font-bold text-gray-900">${l.loanprovider} <span class="text-xs font-normal text-gray-500">(${l.itemdescription || ''})</span></div>
                  <div class="text-[11px] text-gray-500">Holder: <span class="font-semibold text-indigo-700">${l.accountholder}</span> | Payer: <span class="font-semibold text-blue-700">${l.actualpayer}</span></div>
                </div>
              </div>
              <div class="text-right">
                <div class="font-bold text-indigo-900 text-sm">₱${monthly.toFixed(2)}<span class="text-[10px] font-normal text-gray-500">/mo</span></div>
                ${badgeHtml}
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="space-y-1">
              <div class="flex justify-between text-[11px] text-gray-600 font-medium">
                <span>Progress: ${paidM} / ${totalM} months paid</span>
                <span>${progressPercent}%</span>
              </div>
              <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                <div class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
              </div>
            </div>

            <div class="flex justify-between items-center pt-1 border-t border-gray-200/60 text-xs">
              <span class="text-gray-500">Remaining: <strong class="text-gray-800">₱${remainingBal.toFixed(2)}</strong></span>
              ${!isCompleted && !isPending ? `
                <button onclick="payLoan('${l.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] px-3 py-1 rounded-xl font-bold shadow-sm transition">
                  Mark Paid (This Month)
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('sumTotal').innerText = `₱${grandTotal.toFixed(2)}`;
      document.getElementById('sumPaid').innerText = `₱${grandPaid.toFixed(2)}`;
      document.getElementById('sumRemaining').innerText = `₱${grandRemaining.toFixed(2)}`;
      document.getElementById('loanCountBadge').innerText = `${activeCount} Active`;
    }

    function updateSelectedCount() {
      const checkedBoxes = document.querySelectorAll('.loan-checkbox:checked');
      const box = document.getElementById('consolidatedActionBox');
      const text = document.getElementById('selectedCountText');
      if (checkedBoxes.length > 0) {
        box.classList.remove('hidden');
        text.innerText = `${checkedBoxes.length} loan(s) selected for bulk payment`;
      } else {
        box.classList.add('hidden');
      }
    }

    async function payLoan(id) {
      if (!confirm("I-mark ba bilang bayad ang buwang ito para sa loang ito?")) return;
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "payLoanMonth", id: id, actor: currentUser })
      });
      alert("Loan month updated successfully!");
      setTimeout(fetchLoansData, 1500);
    }

    async function paySelectedLoans() {
      const checkedBoxes = document.querySelectorAll('.loan-checkbox:checked');
      const ids = Array.from(checkedBoxes).map(cb => cb.value);
      if (!ids.length) return;

      if (!confirm(`I-mark ba bilang bayad ang ${ids.length} na napiling loan para sa buwang ito?`)) return;

      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "payConsolidatedBnpl", ids: ids, groupLabel: "Bulk Pay", actor: currentUser })
      });
      alert("Consolidated loans updated successfully!");
      setTimeout(fetchLoansData, 1500);
    }

    document.getElementById('loanForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addLoan",
          loanProvider: document.getElementById('loanProvider').value,
          itemDesc: document.getElementById('itemDesc').value,
          holder: document.getElementById('accHolder').value,
          payer: document.getElementById('actualPayer').value,
          monthlyDue: document.getElementById('monthlyDue').value,
          totalMonths: document.getElementById('totalMonths').value,
            dueDay: document.getElementById('dueDay').value,
          actor: currentUser
        })
      });
      alert("Loan successfully added!");
      document.getElementById('loanForm').reset();
      setTimeout(fetchLoansData, 1500);
    });

    fetchLoansData();
  </script>
</body>
</html>
