<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BelPan House Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">

  <!-- LOGIN OVERLAY MODAL -->
  <div id="loginOverlay" class="fixed inset-0 bg-blue-900/95 z-[100] flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center">
      <div class="text-4xl">🔐</div>
      <div>
        <h2 class="text-xl font-bold text-gray-800">BelPan House Hub</h2>
        <p class="text-xs text-gray-500 mt-1">Please log in to access your personal dashboard</p>
      </div>
      <form id="loginForm" class="space-y-3 text-left">
        <div>
          <label class="text-xs font-semibold text-gray-500">Your Full Name</label>
          <input type="text" id="loginName" required placeholder="e.g. Froilan" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">PIN / Passcode</label>
          <input type="password" id="loginPin" placeholder="Default PIN: 1234 or mobile no." class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
        </div>
        <p id="loginError" class="text-xs text-red-600 hidden text-center font-bold"></p>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition shadow-lg">Log In</button>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <div>
      <h1 class="text-lg font-bold">🏠 BelPan House Hub</h1>
      <div class="flex items-center gap-1.5 text-[11px] text-blue-100 mt-0.5">
        <span>Account:</span>
        <span id="activeUserName" class="bg-blue-800 text-white px-2 py-0.5 rounded font-bold border border-blue-400">Not Logged In</span>
        <button onclick="logout()" class="text-[10px] bg-red-500/80 hover:bg-red-600 px-1.5 py-0.5 rounded font-bold">Logout</button>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="location.href='directory.html'" class="bg-teal-700 hover:bg-teal-800 text-white px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 shadow-sm" title="Contacts Directory">
        🎴 Contacts
      </button>
      <button onclick="location.href='adminLogs.html'" id="adminNavBtn" class="bg-purple-700 hover:bg-purple-800 text-white px-2.5 py-1.5 rounded-xl text-xs font-semibold hidden" title="Admin Audit Logs">🛡️</button>
    </div>
  </header>

  <!-- USER SUMMARY BANNER -->
  <div id="userSummaryCard" class="px-4 mb-3">
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-3.5 rounded-2xl shadow-md border border-blue-700">
      <div class="flex justify-between items-center border-b border-blue-700/50 pb-2 mb-2">
        <span class="text-xs font-bold text-blue-200">👤 Private View: <span id="summaryUserName" class="text-white">---</span></span>
        <span class="text-[10px] bg-blue-800 text-blue-200 px-2 py-0.5 rounded-full">Personal Balance</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-blue-800/40 p-2 rounded-xl border border-blue-700/30">
          <span class="text-[10px] text-green-300 block font-semibold">Sisingilin Mo (To Receive):</span>
          <span id="userReceivable" class="font-bold text-green-400 text-sm">₱0.00</span>
        </div>
        <div class="bg-blue-800/40 p-2 rounded-xl border border-blue-700/30">
          <span class="text-[10px] text-red-300 block font-semibold">Utang Mo (To Pay):</span>
          <span id="userPayable" class="font-bold text-red-400 text-sm">₱0.00</span>
        </div>
      </div>
    </div>
  </div>

  <main class="px-4 flex-1 space-y-4">

    <!-- DASHBOARD MENU TILES -->
    <section class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <button onclick="location.href='loans.html'" class="col-span-2 bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-4 rounded-2xl shadow-md flex items-center justify-between hover:opacity-95 transition active:scale-95">
          <div class="flex items-center gap-3">
            <span class="text-3xl">🏦</span>
            <div class="text-left">
              <span class="font-bold text-sm block">Loans & Installments</span>
              <span id="dashLoanSub" class="text-[11px] text-indigo-100 block">Track monthly dues & remaining months</span>
            </div>
          </div>
          <span class="text-lg">➡️</span>
        </button>

        <button onclick="location.href='expenses.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-blue-50 transition active:scale-95">
          <span class="text-3xl mb-1">💰</span>
          <span class="font-bold text-gray-800 text-sm">Daily Expenses</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Log daily costs</span>
        </button>

        <button onclick="location.href='bills.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-indigo-50 transition active:scale-95">
          <span class="text-3xl mb-1">📃</span>
          <span class="font-bold text-gray-800 text-sm">Bills & Utilities</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Internet, electricity, events</span>
        </button>

        <button onclick="location.href='grocery.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-green-50 transition active:scale-95">
          <span class="text-3xl mb-1">🛒</span>
          <span class="font-bold text-gray-800 text-sm">Grocery List</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Needed supplies</span>
        </button>

        <button onclick="location.href='lista.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-purple-50 transition active:scale-95">
          <span class="text-3xl mb-1">📋</span>
          <span class="font-bold text-gray-800 text-sm">Lista Vault</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Sisingilin & Utang</span>
        </button>

        <button onclick="location.href='kkb.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-pink-50 transition active:scale-95">
          <span class="text-3xl mb-1">🍔</span>
          <span class="font-bold text-gray-800 text-sm">KKB Splitter</span>
          <span class="text-[10px] text-gray-400 mt-0.5">With Cash/Full/Half</span>
        </button>

        <button onclick="location.href='parcels.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-orange-50 transition active:scale-95">
          <span class="text-3xl mb-1">📦</span>
          <span class="font-bold text-gray-800 text-sm">My Parcels</span>
          <span class="text-[10px] text-gray-400 mt-0.5">COD & Auto-Lista</span>
        </button>

        <button onclick="location.href='hotspot.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-cyan-50 transition active:scale-95">
          <span class="text-3xl mb-1">📶</span>
          <span class="font-bold text-gray-800 text-sm">Hotspot Wi-Fi</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Sales & Utang log</span>
        </button>

        <button onclick="location.href='meter.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-yellow-50 transition active:scale-95">
          <span class="text-3xl mb-1">⚡</span>
          <span class="font-bold text-gray-800 text-sm">Sub-Meter</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Baking room kWh</span>
        </button>

        <button onclick="location.href='vehicle.html'" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center hover:bg-red-50 transition active:scale-95">
          <span class="text-3xl mb-1">🛵</span>
          <span class="font-bold text-gray-800 text-sm">Vehicle Care</span>
          <span class="text-[10px] text-gray-400 mt-0.5">Change oil & repairs</span>
        </button>
      </div>

      <!-- UPCOMING DUES PREVIEW CARD -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-gray-700 text-xs uppercase">⏰ Upcoming Dues & Bills (Top 5)</h3>
        </div>
        <div id="dashUpcomingList" class="space-y-2 text-xs">
          <p class="text-gray-400 text-center">Loading upcoming dues...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    let currentUser = localStorage.getItem("household_hub_user") || "";
    const ADMIN_USER = "Froilan"; 

    function checkAuth() {
      if (!currentUser) {
        document.getElementById('loginOverlay').classList.remove('hidden');
        document.getElementById('activeUserName').innerText = "Not Logged In";
        document.getElementById('adminNavBtn').classList.add('hidden');
      } else {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('activeUserName').innerText = currentUser;
        document.getElementById('summaryUserName').innerText = currentUser;
        
        if (currentUser.toLowerCase() === ADMIN_USER.toLowerCase() || currentUser.toLowerCase().includes("admin")) {
          document.getElementById('adminNavBtn').classList.remove('hidden');
        } else {
          document.getElementById('adminNavBtn').classList.add('hidden');
        }

        fetchDashboardData();
      }
    }

    function logout() {
      if (confirm("Log out of your profile?")) {
        localStorage.removeItem("household_hub_user");
        currentUser = "";
        location.reload();
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('loginName').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "loginUser", name: name, pin: pin })
        });
        const json = await res.json();
        if (json.status === "success") {
          currentUser = name;
          localStorage.setItem("household_hub_user", name);
          checkAuth();
        } else {
          errEl.innerText = json.message || "Invalid credentials!";
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        currentUser = name;
        localStorage.setItem("household_hub_user", name);
        checkAuth();
      }
    });

    async function fetchDashboardData() {
      if (!currentUser) return;
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          renderDashboardSummary(json.data.debts || []);
          renderDashboardUpcoming(json.data.recurring || [], json.data.loans || []);
        }
      } catch (e) {
        console.error("Dashboard data load failed:", e);
      }
    }

    function renderDashboardSummary(debts) {
      let receivable = 0;
      let payable = 0;
      debts.forEach(d => {
        const amt = parseFloat(d.amount) || 0;
        const status = String(d.status || '');
        const personName = String(d.borrowerperson || d.person || '');
        const loggedUser = String(d.loggedby || '');

        if (status === 'Unpaid') {
          if (loggedUser.toLowerCase() === currentUser.toLowerCase() && personName.toLowerCase() !== currentUser.toLowerCase()) {
            receivable += amt;
          } else if (personName.toLowerCase() === currentUser.toLowerCase() && loggedUser.toLowerCase() !== currentUser.toLowerCase()) {
            payable += amt;
          }
        }
      });
      document.getElementById('userReceivable').innerText = `₱${receivable.toFixed(2)}`;
      document.getElementById('userPayable').innerText = `₱${payable.toFixed(2)}`;
    }

    function renderDashboardUpcoming(bills, loans) {
      const container = document.getElementById('dashUpcomingList');
      let combined = [];

      if (bills) {
        bills.forEach(b => {
          if (String(b.status || '') !== 'Paid') {
            combined.push({
              name: b.billname || 'Bill',
              amount: parseFloat(b.amount || 0),
              day: parseInt(b.duedatedayofmonth) || 99,
              type: 'Bill',
              targetPage: 'bills.html'
            });
          }
        });
      }

      const currMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
      if (loans) {
        loans.forEach(l => {
          const remM = Math.max(0, (parseInt(l.totalmonths) || 1) - (parseInt(l.monthspaid) || 0));
          const isPaidThisMonth = String(l.lastpaidmonth) === currMonth || remM === 0;
          if (remM > 0 && !isPaidThisMonth && l.status !== 'Pending Approval') {
            combined.push({
              name: `${l.loanprovider || 'Loan'} (${l.itemdescription || ''})`,
              amount: parseFloat(l.monthlydue || 0),
              day: parseInt(String(l.dueday || '1').replace(/\D/g, '')) || 15,
              type: 'Loan',
              targetPage: 'loans.html'
            });
          }
        });
      }

      combined.sort((a, b) => a.day - b.day);
      const top5 = combined.slice(0, 5);

      if (!top5.length) {
        container.innerHTML = '<p class="text-gray-400 text-center py-1">No upcoming dues or bills! 🎉</p>';
        return;
      }

      container.innerHTML = top5.map(item => `
        <div onclick="location.href='${item.targetPage}'" class="p-2.5 bg-gray-50 hover:bg-blue-50 cursor-pointer rounded-xl border border-gray-100 flex justify-between items-center transition">
          <div>
            <div class="font-bold text-gray-800">${item.name} <span class="text-[10px] text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded font-semibold">${item.type}</span></div>
            <div class="text-[10px] text-gray-500">Due day: Every ${item.day}th • Tap to open</div>
          </div>
          <div class="text-right font-bold text-gray-900">₱${item.amount.toFixed(2)}</div>
        </div>
      `).join('');
    }

    checkAuth();
  </script>
</body>
</html>
