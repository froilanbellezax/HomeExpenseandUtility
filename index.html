<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BelPan House Hub</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-12 max-w-md mx-auto min-h-screen flex flex-col relative">

  <!-- LOGIN OVERLAY MODAL -->
  <div id="loginOverlay" class="fixed inset-0 bg-indigo-950/95 z-[100] flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center">
      <div class="text-4xl">🏠</div>
      <div>
        <h2 class="text-xl font-extrabold text-gray-800">BelPan House Hub</h2>
        <p class="text-xs text-gray-500 mt-1">Sign in with your household profile</p>
      </div>
      <form id="loginForm" class="space-y-3 text-left">
        <div>
          <label class="text-xs font-semibold text-gray-500">Your Name</label>
          <input type="text" id="loginName" required placeholder="e.g. Froilan" class="w-full p-3 border rounded-xl text-sm outline-none font-semibold">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">PIN / Passcode</label>
          <input type="password" id="loginPin" placeholder="Default PIN: 1234" class="w-full p-3 border rounded-xl text-sm outline-none font-semibold">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-lg">Log In</button>
      </form>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-indigo-700 to-blue-800 text-white p-4 shadow-md rounded-b-2xl mb-4 sticky top-0 z-50 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-extrabold tracking-tight">🏠 BelPan House Hub</h1>
      <p id="welcomeUser" class="text-[11px] text-indigo-200 font-medium">Loading profile...</p>
    </div>
    <button onclick="logoutUser()" class="bg-white/15 hover:bg-white/25 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition">🚪 Logout</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <!-- QUICK SNAPSHOT BANNER -->
    <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-md border border-indigo-500/30 space-y-2.5">
      <div class="flex justify-between items-center">
        <span class="text-[11px] font-bold text-indigo-300 uppercase">📊 This Month's Snapshot</span>
        <span id="dashMonthBadge" class="text-[10px] bg-indigo-700 px-2 py-0.5 rounded-full font-bold">---</span>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-white/10 p-3 rounded-xl">
          <span class="text-[10px] text-amber-300 block font-semibold">Unpaid Loans & BNPL</span>
          <span id="dashLoansDue" class="text-base font-extrabold text-amber-400">₱0.00</span>
        </div>
        <div class="bg-white/10 p-3 rounded-xl">
          <span class="text-[10px] text-cyan-300 block font-semibold">Unpaid Utility Bills</span>
          <span id="dashBillsDue" class="text-base font-extrabold text-cyan-400">₱0.00</span>
        </div>
      </div>
    </div>

    <!-- PRIMARY MODULES -->
    <div>
      <h2 class="text-xs font-bold text-gray-500 uppercase mb-2 px-1">💳 Finances & Obligations</h2>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="location.href='expenses.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">💸</div>
          <div class="font-bold text-sm text-gray-800">Daily Expenses</div>
          <div class="text-[10px] text-gray-500">Swipes, cash & logs</div>
        </button>

        <button onclick="location.href='loans.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🏦</div>
          <div class="font-bold text-sm text-gray-800">Loans & BNPL</div>
          <div class="text-[10px] text-gray-500">PayLater & Credit Cards</div>
        </button>

        <button onclick="location.href='bills.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🧾</div>
          <div class="font-bold text-sm text-gray-800">Utility Bills</div>
          <div class="text-[10px] text-gray-500">Electric, water, internet</div>
        </button>

        <button onclick="location.href='grocery.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🛒</div>
          <div class="font-bold text-sm text-gray-800">Grocery List</div>
          <div class="text-[10px] text-gray-500">Pantry & market budget</div>
        </button>

        <button onclick="location.href='kkb.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🤝</div>
          <div class="font-bold text-sm text-gray-800">KKB Split</div>
          <div class="text-[10px] text-gray-500">Shared bill splitting</div>
        </button>

        <button onclick="location.href='lista.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">📒</div>
          <div class="font-bold text-sm text-gray-800">Lista / Debts</div>
          <div class="text-[10px] text-gray-500">Utang & collectibles</div>
        </button>
      </div>
    </div>

    <!-- HOUSEHOLD, UTILITIES & TRACKERS -->
    <div>
      <h2 class="text-xs font-bold text-gray-500 uppercase mb-2 px-1">⚡ Utilities, Load & Deliveries</h2>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="location.href='meter.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🔌</div>
          <div class="font-bold text-sm text-gray-800">Submeter</div>
          <div class="text-[10px] text-gray-500">kWh reading & rate</div>
        </button>

        <button onclick="location.href='loads.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">📱</div>
          <div class="font-bold text-sm text-gray-800">e-Load Tracker</div>
          <div class="text-[10px] text-gray-500">SIM load & promos</div>
        </button>

        <button onclick="location.href='parcels.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">📦</div>
          <div class="font-bold text-sm text-gray-800">Parcels</div>
          <div class="text-[10px] text-gray-500">COD & incoming orders</div>
        </button>

        <button onclick="location.href='vehicle.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🏍️</div>
          <div class="font-bold text-sm text-gray-800">Vehicle Log</div>
          <div class="text-[10px] text-gray-500">Gas, oil & maintenance</div>
        </button>
      </div>
    </div>

    <!-- NETWORK & ADMIN -->
    <div>
      <h2 class="text-xs font-bold text-gray-500 uppercase mb-2 px-1">📡 Hotspot & Directory</h2>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="location.href='hotspot.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">📶</div>
          <div class="font-bold text-sm text-gray-800">Hotspot Vouchers</div>
          <div class="text-[10px] text-gray-500">MikroTik sales & logs</div>
        </button>

        <button onclick="location.href='hotspotMonthly.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🗓️</div>
          <div class="font-bold text-sm text-gray-800">Monthly Wi-Fi</div>
          <div class="text-[10px] text-gray-500">Monthly subscribers</div>
        </button>

        <button onclick="location.href='directory.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">📇</div>
          <div class="font-bold text-sm text-gray-800">Directory</div>
          <div class="text-[10px] text-gray-500">Contacts & accounts</div>
        </button>

        <button id="adminLogsCard" onclick="location.href='adminLogs.html'" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 text-left space-y-1 transition active:scale-95">
          <div class="text-2xl">🛡️</div>
          <div class="font-bold text-sm text-gray-800">Admin Logs</div>
          <div class="text-[10px] text-gray-500">Activity & audit trail</div>
        </button>
      </div>
    </div>
  </main>

  <script>
    // Clear any stale Service Worker cache causing redirect loops
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    let currentUser = localStorage.getItem("household_hub_user") || "";
    let sessionToken = localStorage.getItem("household_hub_token") || "";

    function formatMoney(val) {
      const num = parseFloat(val) || 0;
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showLogin() {
      localStorage.removeItem("household_hub_user");
      localStorage.removeItem("household_hub_token");
      currentUser = "";
      sessionToken = "";
      document.getElementById('loginOverlay').classList.remove('hidden');
    }

    function logoutUser() {
      if (confirm("Log out of BelPan House Hub?")) {
        showLogin();
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const name = document.getElementById('loginName').value.trim();
      const pin = document.getElementById('loginPin').value.trim() || "1234";

      btn.disabled = true;
      btn.innerText = "Signing in...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "loginUser", name: name, pin: pin })
        });
        const json = await res.json();

        if (json.status === "success" && json.token) {
          currentUser = json.user || name;
          sessionToken = json.token;
          localStorage.setItem("household_hub_user", currentUser);
          localStorage.setItem("household_hub_token", sessionToken);
          document.getElementById('loginOverlay').classList.add('hidden');
          initDashboard();
        } else {
          alert(json.message || "Invalid Name or PIN.");
        }
      } catch (err) {
        alert("Unable to connect to server. Please check your internet connection.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Log In";
      }
    });

    async function initDashboard() {
      if (!currentUser || !sessionToken) {
        showLogin();
        return;
      }

      document.getElementById('welcomeUser').innerText = `Welcome back, ${currentUser}!`;
      const now = new Date();
      const currMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('dashMonthBadge').innerText = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      try {
        const res = await fetch(`${API_URL}?token=${encodeURIComponent(sessionToken)}`);
        const json = await res.json();

        if (json.status === "unauthorized") {
          showLogin();
          return;
        }

        if (json.status === "success") {
          const loans = json.data.loans || [];
          const cards = json.data.creditCards || [];
          const bills = json.data.bills || [];

          let unpaidLoans = 0;
          loans.forEach(l => {
            const monthly = parseFloat(l.monthlydue) || 0;
            const totalM = parseInt(l.totalmonths) || 1;
            const paidM = parseInt(l.monthspaid) || 0;
            const remM = Math.max(0, totalM - paidM);
            const startM = String(l.startmonth || currMonth).replace(/'/g, '').trim();
            const lastPaid = String(l.lastpaidmonth || '').replace(/'/g, '').trim();
            const isStarted = !startM || currMonth >= startM;
            const isPaidThisMonth = lastPaid.startsWith(currMonth) || remM === 0;
            if (remM > 0 && isStarted && !isPaidThisMonth && l.status !== 'Pending Approval') {
              unpaidLoans += monthly;
            }
          });

          cards.forEach(c => {
            const amt = parseFloat(c.statementamount) || 0;
            const remAmt = c.remainingbalance !== undefined && c.remainingbalance !== ""
              ? parseFloat(c.remainingbalance)
              : (String(c.status || '').toLowerCase() === 'paid' ? 0 : amt);
            const bMonth = String(c.billingmonth || '').replace(/'/g, '').trim();
            if (String(c.status || '').toLowerCase() !== 'paid' && remAmt > 0 && bMonth === currMonth) {
              unpaidLoans += remAmt;
            }
          });

          let unpaidBills = 0;
          bills.forEach(b => {
            if (String(b.status || '').toLowerCase() !== 'paid') {
              unpaidBills += parseFloat(b.amount) || 0;
            }
          });

          document.getElementById('dashLoansDue').innerText = `₱${formatMoney(unpaidLoans)}`;
          document.getElementById('dashBillsDue').innerText = `₱${formatMoney(unpaidBills)}`;
        }
      } catch (e) {
        console.error("Dashboard load error:", e);
      }
    }

    initDashboard();
  </script>
</body>
</html>
