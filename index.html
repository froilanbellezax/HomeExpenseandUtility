<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Expense & Utility Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-lg mx-auto">

  <header class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-gray-900">🏠 Home Expense Tracker</h1>
    <p class="text-sm text-gray-500">Log daily expenses & utility bills</p>
  </header>

  <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-6">
    <form id="expenseForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Amount (₱)</label>
        <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full text-xl font-bold p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Category</label>
          <select id="category" class="w-full p-3 border rounded-xl bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Electricity">⚡ Electricity</option>
            <option value="Water">💧 Water</option>
            <option value="Groceries">🛒 Groceries</option>
            <option value="Internet/Load">🌐 Internet / Load</option>
            <option value="LPG">🔥 LPG</option>
            <option value="Maintenance">🛠️ Maintenance</option>
            <option value="Others">📦 Others</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Date</label>
          <input type="date" id="date" required class="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description / Notes</label>
        <input type="text" id="description" placeholder="e.g., Water bill, Puregold run" class="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
        Save Expense
      </button>
    </form>
  </section>

  <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-3">Expenses Breakdown</h2>
    <canvas id="expenseChart" class="max-h-56"></canvas>
  </section>

  <script>
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    document.getElementById('date').valueAsDate = new Date();
    let chartInstance = null;

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        if (result.status === "success") {
          renderChart(result.data);
        }
      } catch (err) {
        console.error("Failed to load history:", err);
      }
    }

    function renderChart(data) {
      const totalsPerCategory = {};
      data.forEach(item => {
        const amt = parseFloat(item.amount) || 0;
        totalsPerCategory[item.category] = (totalsPerCategory[item.category] || 0) + amt;
      });

      const labels = Object.keys(totalsPerCategory);
      const values = Object.values(totalsPerCategory);

      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#3B82F6', '#06B6D4', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#6B7280']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Saving...";

      const payload = {
        amount: document.getElementById('amount').value,
        category: document.getElementById('category').value,
        date: document.getElementById('date').value,
        description: document.getElementById('description').value,
        paymentMethod: "Cash/Online"
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("Expense logged!");
        document.getElementById('expenseForm').reset();
        document.getElementById('date').valueAsDate = new Date();
        setTimeout(loadData, 1500);
      } catch (err) {
        alert("Failed to submit.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Save Expense";
      }
    });

    loadData();
  </script>
</body>
</html>
