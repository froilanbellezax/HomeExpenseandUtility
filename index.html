<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24 max-w-md mx-auto">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md rounded-b-2xl mb-4">
    <h1 class="text-xl font-bold text-center">🏡 Household Hub</h1>
    <p class="text-xs text-center text-blue-100">Family Tracker & Operations</p>
  </header>

  <main class="px-4">

    <!-- 1. EXPENSES TAB -->
    <section id="tab-expenses" class="tab-content space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">💰 Log Expense / Bill</h2>
        <form id="expenseForm" class="space-y-3">
          <div>
            <label class="text-xs font-semibold text-gray-500">Amount (₱)</label>
            <input type="number" step="0.01" id="expAmount" required placeholder="0.00" class="w-full text-lg font-bold p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-gray-500">Category</label>
              <select id="expCategory" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Electricity">⚡ Electricity</option>
                <option value="Water">💧 Water</option>
                <option value="Groceries">🛒 Groceries</option>
                <option value="Internet/Load">🌐 Internet / Load</option>
                <option value="LPG">🔥 LPG</option>
                <option value="Maintenance">🛠️ Maintenance</option>
                <option value="Others">📦 Others</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Logged By</label>
              <input type="text" id="expUser" required placeholder="Name" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Notes / Details</label>
            <input type="text" id="expDesc" placeholder="e.g. VECO bill, Palengke" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Save Expense</button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="font-semibold text-gray-700 text-xs uppercase mb-2">Spending Breakdown</h3>
        <canvas id="expenseChart" class="max-h-48"></canvas>
      </div>
    </section>

    <!-- 2. GROCERY CHECKLIST TAB -->
    <section id="tab-grocery" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">🛒 Add Needed Item</h2>
        <form id="groceryForm" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-gray-500">Item Name</label>
              <input type="text" id="grocItem" required placeholder="e.g. Sabon, Mantika" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Qty / Unit</label>
              <input type="text" id="grocQty" placeholder="e.g. 2 packs" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Requested By</label>
            <input type="text" id="grocUser" required placeholder="Name" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition">Add to List</button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Pending Household Needs</h3>
        <ul id="groceryList" class="divide-y divide-gray-100 text-sm">
          <li class="py-2 text-gray-400 text-center">Loading list...</li>
        </ul>
      </div>
    </section>

    <!-- 3. PARCELS TAB -->
    <section id="tab-parcels" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">📦 Log Delivery / Parcel</h2>
        <form id="parcelForm" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-gray-500">For Whom (Recipient)</label>
              <input type="text" id="parcFor" required placeholder="Owner" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Courier / App</label>
              <input type="text" id="parcCourier" placeholder="Shopee/Lazada/J&T" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-gray-500">COD Amount (₱)</label>
              <input type="number" step="0.01" id="parcAmount" placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Payment Status</label>
              <select id="parcStatus" class="w-full p-2.5 border rounded-xl text-sm outline-none">
                <option value="Paid by Owner">Paid by Owner</option>
                <option value="Abono Needed (Unpaid)">Abono (Unpaid)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Received By</label>
            <input type="text" id="parcReceiver" required placeholder="Sino nag-receive sa pinto?" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <button type="submit" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl hover:bg-orange-600 transition">Log Delivery</button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Recent Deliveries</h3>
        <div id="parcelsList" class="space-y-2 text-sm">
          <p class="text-gray-400 text-center">Loading parcels...</p>
        </div>
      </div>
    </section>

    <!-- 4. REIMBURSEMENTS TAB -->
    <section id="tab-reimburse" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">💸 File Claim / Abono</h2>
        <form id="reimburseForm" class="space-y-3">
          <div>
            <label class="text-xs font-semibold text-gray-500">Paid By (Sino nag-abono?)</label>
            <input type="text" id="reimPayer" required placeholder="Name" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-gray-500">Amount (₱)</label>
              <input type="number" step="0.01" id="reimAmount" required placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-500">Item / Reason</label>
              <input type="text" id="reimDesc" required placeholder="e.g. LPG, Hardware" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            </div>
          </div>
          <button type="submit" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl hover:bg-purple-700 transition">Submit Claim</button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Pending Claims</h3>
        <div id="reimburseList" class="space-y-2 text-sm">
          <p class="text-gray-400 text-center">Loading claims...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around p-2 text-xs font-semibold text-gray-600 z-50">
    <button onclick="switchTab('expenses')" id="nav-expenses" class="flex flex-col items-center py-1 text-blue-600">
      <span>💰</span>
      <span>Expenses</span>
    </button>
    <button onclick="switchTab('grocery')" id="nav-grocery" class="flex flex-col items-center py-1">
      <span>🛒</span>
      <span>Grocery</span>
    </button>
    <button onclick="switchTab('parcels')" id="nav-parcels" class="flex flex-col items-center py-1">
      <span>📦</span>
      <span>Parcels</span>
    </button>
    <button onclick="switchTab('reimburse')" id="nav-reimburse" class="flex flex-col items-center py-1">
      <span>💸</span>
      <span>Claims</span>
    </button>
  </nav>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";

    let chartInstance = null;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('text-blue-600'));
      
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('text-blue-600');
    }

    async function fetchAllData() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === "success") {
          renderExpensesChart(json.data.transactions);
          renderGrocery(json.data.grocery);
          renderParcels(json.data.parcels);
          renderReimbursements(json.data.reimbursements);
        }
      } catch (e) {
        console.error("Data load failed:", e);
      }
    }

    function renderExpensesChart(data) {
      if(!data || !data.length) return;
      const totals = {};
      data.forEach(item => {
        const cat = item.category || 'Others';
        totals[cat] = (totals[cat] || 0) + (parseFloat(item.amount) || 0);
      });
      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(totals),
          datasets: [{ data: Object.values(totals), backgroundColor: ['#3B82F6', '#06B6D4', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function renderGrocery(data) {
      const list = document.getElementById('groceryList');
      if (!data || !data.length) { list.innerHTML = '<li class="py-2 text-gray-400 text-center">No items needed!</li>'; return; }
      list.innerHTML = data.map(i => `
        <li class="py-2 flex justify-between items-center">
          <div>
            <span class="font-bold text-gray-800">${i.item}</span> 
            <span class="text-xs text-gray-400">(${i.quantity || '1'})</span>
            <div class="text-xs text-gray-400">Req by: ${i.requestedby}</div>
          </div>
          <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-semibold">${i.status}</span>
        </li>
      `).join('');
    }

    function renderParcels(data) {
      const container = document.getElementById('parcelsList');
      if (!data || !data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No parcel logs yet.</p>'; return; }
      container.innerHTML = data.map(p => `
        <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">For: ${p.recipient}</div>
            <div class="text-xs text-gray-500">${p.courierstore} • Rcvd by: ${p.receivedby}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-gray-900">₱${parseFloat(p.amount || 0).toFixed(2)}</div>
            <span class="text-xs font-semibold ${p.paymentstatus?.includes('Paid') ? 'text-green-600' : 'text-red-500'}">${p.paymentstatus}</span>
          </div>
        </div>
      `).join('');
    }

    function renderReimbursements(data) {
      const container = document.getElementById('reimburseList');
      if (!data || !data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No pending claims.</p>'; return; }
      container.innerHTML = data.map(r => `
        <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">${r.paidby}</div>
            <div class="text-xs text-gray-500">${r.description}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-purple-700">₱${parseFloat(r.amount || 0).toFixed(2)}</div>
            <span class="text-xs font-semibold text-amber-600">${r.reimbursementstatus}</span>
          </div>
        </div>
      `).join('');
    }

    // Generic Submit Handler
    async function postData(payload, formId) {
      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        alert("Saved successfully!");
        document.getElementById(formId).reset();
        setTimeout(fetchAllData, 1500);
      } catch(e) {
        alert("Failed to submit.");
      }
    }

    document.getElementById('expenseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      postData({
        action: "addExpense",
        date: new Date().toISOString().split('T')[0],
        amount: document.getElementById('expAmount').value,
        category: document.getElementById('expCategory').value,
        loggedBy: document.getElementById('expUser').value,
        description: document.getElementById('expDesc').value,
        paymentMethod: "Cash/Online"
      }, 'expenseForm');
    });

    document.getElementById('groceryForm').addEventListener('submit', (e) => {
      e.preventDefault();
      postData({
        action: "addGrocery",
        item: document.getElementById('grocItem').value,
        quantity: document.getElementById('grocQty').value,
        requestedBy: document.getElementById('grocUser').value
      }, 'groceryForm');
    });

    document.getElementById('parcelForm').addEventListener('submit', (e) => {
      e.preventDefault();
      postData({
        action: "addParcel",
        recipient: document.getElementById('parcFor').value,
        courier: document.getElementById('parcCourier').value,
        amount: document.getElementById('parcAmount').value,
        paymentStatus: document.getElementById('parcStatus').value,
        receivedBy: document.getElementById('parcReceiver').value,
        notes: ""
      }, 'parcelForm');
    });

    document.getElementById('reimburseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      postData({
        action: "addReimbursement",
        paidBy: document.getElementById('reimPayer').value,
        amount: document.getElementById('reimAmount').value,
        description: document.getElementById('reimDesc').value
      }, 'reimburseForm');
    });

    fetchAllData();
  </script>
</body>
</html>
