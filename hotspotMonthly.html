<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Wi-Fi Matrix - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-7xl mx-auto min-h-screen flex flex-col relative px-2">
  <header class="bg-cyan-700 text-white p-4 shadow-md rounded-b-2xl mb-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📅 Monthly Wi-Fi Subscribers & Matrix</h1>
    <button onclick="location.href='index.html'" class="bg-cyan-900 hover:bg-cyan-950 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="space-y-5">
    <!-- LOG PAYMENT / CUT STATUS FORM -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Log Payment or Set Inactive/Cut Month</h2>
      <form id="monthlyForm" class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Category Table</label>
            <select id="mthTable" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-cyan-800">
              <option value="Students">🎓 Students</option>
              <option value="Adults">👔 Adults</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Full Name (User)</label>
            <input type="text" id="mthName" list="existingSubscribers" required placeholder="Type or select name" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
            <datalist id="existingSubscribers"></datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Due Day (e.g. 5)</label>
            <input type="number" min="1" max="31" id="mthDue" required value="5" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Target Month</label>
            <select id="mthMonth" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-cyan-900">
              <option value="January 2026">January 2026</option>
              <option value="February 2026">February 2026</option>
              <option value="March 2026" selected>March 2026</option>
              <option value="April 2026">April 2026</option>
              <option value="May 2026">May 2026</option>
              <option value="June 2026">June 2026</option>
              <option value="July 2026">July 2026</option>
              <option value="August 2026">August 2026</option>
              <option value="September 2026">September 2026</option>
              <option value="October 2026">October 2026</option>
              <option value="November 2026">November 2026</option>
              <option value="December 2026">December 2026</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Record Action / Status</label>
            <select id="mthStatus" onchange="toggleAmountField()" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
              <option value="Paid">✅ Paid (Active)</option>
              <option value="Inactive">⬛ Cut / Inactive (Hold)</option>
            </select>
          </div>
          <div id="amountContainer">
            <label class="text-xs font-semibold text-gray-500">Amount Paid (₱)</label>
            <input type="number" step="1" id="mthAmount" required value="200" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
        </div>
        <button type="submit" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl hover:bg-cyan-700 transition">Save Record to Matrix</button>
      </form>
    </div>

    <!-- MATRIX TABLE VIEW WITH FROZEN LEFT COLUMNS & ALPHABETICAL SORTING -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <div>
          <h3 class="font-bold text-cyan-900 text-sm uppercase">📊 Monthly Matrix Tracking (2026 — A to Z)</h3>
          <p class="text-[11px] text-gray-500">✅ Paid &nbsp;|&nbsp; <span class="text-gray-400">-</span> Unpaid &nbsp;|&nbsp; <span class="inline-block w-2.5 h-2.5 bg-gray-900 align-middle rounded-xs"></span> Cut / Inactive</p>
        </div>
        <span class="text-xs text-gray-400">Scroll months ➡️</span>
      </div>

      <div class="overflow-x-auto border rounded-xl shadow-inner relative">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr id="matrixHeaderRow" class="bg-cyan-800 text-white text-center">
              <!-- Populated by JS -->
            </tr>
          </thead>
          <tbody id="matrixTableBody" class="divide-y divide-gray-200 text-center">
            <tr><td colspan="14" class="p-4 text-gray-400 text-center">Loading matrix records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    const monthsList = [
      "January 2026", "February 2026", "March 2026", "April 2026", 
      "May 2026", "June 2026", "July 2026", "August 2026", 
      "September 2026", "October 2026", "November 2026", "December 2026"
    ];

    let subscriberDirectory = {};

    function toggleAmountField() {
      const status = document.getElementById('mthStatus').value;
      const amtInput = document.getElementById('mthAmount');
      const amtContainer = document.getElementById('amountContainer');
      if (status === 'Inactive') {
        amtInput.value = 0;
        amtContainer.classList.add('opacity-40', 'pointer-events-none');
      } else {
        if (amtInput.value == 0) amtInput.value = 200;
        amtContainer.classList.remove('opacity-40', 'pointer-events-none');
      }
    }

    document.getElementById('mthName').addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (subscriberDirectory[val]) {
        document.getElementById('mthDue').value = subscriberDirectory[val].due;
        document.getElementById('mthTable').value = subscriberDirectory[val].category;
      }
    });

    async function fetchMatrixData() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          const students = (json.data.hotspotStudents || []).map(s => ({ ...s, _cat: 'Students' }));
          const adults = (json.data.hotspotAdults || []).map(a => ({ ...a, _cat: 'Adults' }));
          renderMatrix([...students, ...adults]);
        }
      } catch (e) { console.error(e); }
    }

    function renderMatrix(data) {
      const headerRow = document.getElementById('matrixHeaderRow');
      headerRow.innerHTML = `
        <th class="p-2.5 border border-cyan-700 sticky left-0 z-20 bg-cyan-800 w-12 min-w-[3rem]">Due</th>
        <th class="p-2.5 border border-cyan-700 sticky left-12 z-20 bg-cyan-900 min-w-[130px] text-left pl-3 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.3)]">USER (NAME)</th>
        ${monthsList.map(m => `<th class="p-2.5 border border-cyan-700 min-w-[85px]">${m.replace(' 2026', '')}</th>`).join('')}
      `;

      const tbody = document.getElementById('matrixTableBody');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="${monthsList.length + 2}" class="p-4 text-gray-400 text-center">No monthly records in Google Sheet yet.</td></tr>`;
        return;
      }

      const usersMap = {};
      subscriberDirectory = {};

      const chronologicalData = [...data].reverse();

      chronologicalData.forEach(item => {
        let name = 'Unknown', due = '5', rawMonth = '', amount = 0, status = 'Paid';

        Object.keys(item).forEach(k => {
          const lk = k.toLowerCase().replace(/[^a-z0-9]/g, '');
          const val = item[k];
          if (lk === 'name' || lk === 'borrowerperson' || lk === 'person') name = String(val).trim();
          if (lk === 'duedate' || lk === 'due' || lk === 'duedays') due = val;
          if (lk === 'lastpaidmonth' || lk === 'targetmonth' || lk === 'month') rawMonth = String(val);
          if (lk === 'amountpaid' || lk === 'amount') amount = parseFloat(val) || 0;
          if (lk === 'status') status = String(val).trim();
        });

        if (!usersMap[name]) {
          usersMap[name] = { due: due || '5', months: {}, category: item._cat || 'Students' };
        } else {
          if (due) usersMap[name].due = due;
        }

        subscriberDirectory[name] = { due: usersMap[name].due, category: usersMap[name].category };

        if (rawMonth) {
          let monthStr = rawMonth.replace(/'/g, '').trim();
          if (monthStr.includes('/') || !isNaN(Date.parse(monthStr))) {
            const d = new Date(monthStr);
            if (!isNaN(d.getTime())) {
              const monthsNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
              monthStr = `${monthsNames[d.getMonth()]} ${d.getFullYear()}`;
            }
          }

          let matchedCol = monthsList.find(m => m.toLowerCase() === monthStr.toLowerCase() || monthStr.toLowerCase().includes(m.toLowerCase().split(' ')[0]));

          if (matchedCol) {
            usersMap[name].months[matchedCol] = { amount, status };
          }
        }
      });

      // I-sort ang mga pangalan nang alphabetical (A-Z, case-insensitive)
      const sortedNames = Object.keys(usersMap).sort((a, b) => 
        a.localeCompare(b, undefined, { sensitivity: 'base' })
      );

      // Populate datalist nang naka-sort din
      const datalist = document.getElementById('existingSubscribers');
      datalist.innerHTML = sortedNames.map(n => `<option value="${n}">`).join('');

      tbody.innerHTML = sortedNames.map((name, idx) => {
        const user = usersMap[name];
        const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-gray-50';
        const stickyNameBg = idx % 2 === 0 ? 'bg-blue-50' : 'bg-blue-100/80';
        
        let monthsCols = monthsList.map(m => {
          const entry = user.months[m];
          if (entry !== undefined) {
            const st = entry.status.toLowerCase();
            if (st === 'inactive' || st === 'cut' || st === 'hold') {
              return `<td class="p-2 border border-gray-300 bg-gray-900 text-gray-400 font-bold text-[10px] tracking-wider" title="Cut / Inactive">CUT</td>`;
            } else if (st === 'paid') {
              return `<td class="p-2 border border-gray-200 font-bold bg-green-50 text-green-800 text-[11px] whitespace-nowrap">✅ ₱${entry.amount}</td>`;
            } else {
              return `<td class="p-2 border border-gray-200 text-gray-300">-</td>`;
            }
          } else {
            return `<td class="p-2 border border-gray-200 text-gray-300">-</td>`;
          }
        }).join('');

        return `
          <tr class="${rowBg} hover:bg-cyan-50/40 transition">
            <td class="p-2 border border-gray-200 font-semibold text-gray-600 sticky left-0 z-10 ${rowBg}">${user.due}</td>
            <td class="p-2 border border-gray-200 font-bold text-left pl-3 whitespace-nowrap sticky left-12 z-10 ${stickyNameBg} shadow-[2px_0_5px_-2px_rgba(0,0,0,0.15)]">${name}</td>
            ${monthsCols}
          </tr>
        `;
      }).join('');
    }

    document.getElementById('monthlyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addMonthlyHotspotMember",
          targetTable: document.getElementById('mthTable').value,
          name: document.getElementById('mthName').value.trim(),
          dueDate: document.getElementById('mthDue').value,
          lastPaidMonth: document.getElementById('mthMonth').value,
          amountPaid: document.getElementById('mthAmount').value,
          status: document.getElementById('mthStatus').value,
          actor: currentUser
        })
      });
      alert("Saved to Matrix & Sheet!");
      document.getElementById('monthlyForm').reset();
      toggleAmountField();
      setTimeout(fetchMatrixData, 1500);
    });

    fetchMatrixData();
  </script>
</body>
</html>
