<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Load Tracker - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative px-3">
  <header class="bg-emerald-700 text-white p-4 shadow-md rounded-b-2xl mb-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📱 E-Load Requests & Logs</h1>
    <button onclick="location.href='index.html'" class="bg-emerald-900 hover:bg-emerald-950 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="space-y-5 flex-1">
    <!-- ADD LOAD REQUEST FORM -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-xs uppercase">New Load Request / Transaction</h2>
      <form id="loadForm" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-500">Customer / Recipient Name</label>
          <input type="text" id="loadName" required placeholder="e.g. Ate / Mama / Juan" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Mobile Number</label>
            <input type="tel" id="loadMobile" required placeholder="09XXXXXXXXX" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Load Type</label>
            <select id="loadType" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-emerald-900">
              <option value="Promo">🎁 Promo</option>
              <option value="Regular">💳 Regular Load</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Status</label>
            <select id="loadStatus" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
              <option value="Pending">⏳ Pending (To Process)</option>
              <option value="Sent / Processed">✅ Sent / Processed</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Notes / Remarks</label>
            <input type="text" id="loadRemarks" placeholder="e.g. Go50, Unli Data, Bayad na" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition shadow-sm">Save Load Record</button>
      </form>
    </div>

    <!-- LOAD LOGS LIST -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-emerald-900 text-xs uppercase">📋 Recent Load Transactions</h3>
        <button onclick="fetchLoads()" class="text-[11px] text-emerald-700 font-semibold">🔄 Refresh</button>
      </div>

      <div id="loadsListContainer" class="space-y-2.5 text-xs">
        <p class="text-gray-400 text-center py-4">Loading records...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "Froilan";

    async function fetchLoads() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          renderLoads(json.data.loads || []);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function copyNumber(num) {
      navigator.clipboard.writeText(num);
      alert(`Copied: ${num}`);
    }

    async function markAsSent(id) {
      if (!confirm("Mark this load as Sent / Processed?")) return;
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "updateLoadStatus",
          id: id,
          actor: currentUser
        })
      });
      setTimeout(fetchLoads, 1200);
    }

    function renderLoads(loads) {
      const container = document.getElementById('loadsListContainer');
      if (!loads.length) {
        container.innerHTML = '<p class="text-gray-400 text-center py-4">No load records yet.</p>';
        return;
      }

      container.innerHTML = loads.map(item => {
        const id = item.id || '';
        const name = item.name || 'Unknown';
        const mobile = String(item.mobilenumber || item.mobile || '').replace(/'/g, '');
        const type = item.type || 'Promo';
        const remarks = item.remarks || '';
        const status = String(item.status || 'Pending');
        const isSent = status.toLowerCase().includes('sent') || status.toLowerCase().includes('processed');

        const cardBg = isSent ? 'bg-gray-50 border-gray-200' : 'bg-amber-50/70 border-amber-200';
        const statusBadge = isSent
          ? `<span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">✅ Sent / Processed</span>`
          : `<span class="text-[10px] font-bold bg-amber-500 text-white px-2 py-0.5 rounded-full animate-pulse">⏳ Pending</span>`;

        const actionBtn = !isSent && id
          ? `<button onclick="markAsSent('${id}')" class="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded-lg text-[11px] transition">✔️ Mark as Sent</button>`
          : '';

        let dateStr = '';
        if (item.timestamp) {
          const d = new Date(item.timestamp);
          if (!isNaN(d.getTime())) {
            dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          }
        }

        return `
          <div class="p-3 rounded-xl border ${cardBg} space-y-1">
            <div class="flex justify-between items-start gap-2">
              <div>
                <span class="font-bold text-gray-800 text-sm">${name}</span>
                <span class="ml-1 text-[10px] font-semibold bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">${type}</span>
              </div>
              ${statusBadge}
            </div>

            <div class="flex items-center gap-2">
              <span class="font-mono font-bold text-emerald-900 text-xs">${mobile}</span>
              <button onclick="copyNumber('${mobile}')" class="text-[10px] bg-white border border-gray-300 px-1.5 py-0.5 rounded hover:bg-gray-100">📋 Copy</button>
            </div>

            ${remarks ? `<div class="text-[11px] text-gray-600 italic">"${remarks}"</div>` : ''}
            ${dateStr ? `<div class="text-[9px] text-gray-400">${dateStr}</div>` : ''}
            ${actionBtn}
          </div>
        `;
      }).join('');
    }

    document.getElementById('loadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addLoadLog",
          name: document.getElementById('loadName').value.trim(),
          mobile: document.getElementById('loadMobile').value.trim(),
          loadType: document.getElementById('loadType').value,
          remarks: document.getElementById('loadRemarks').value.trim(),
          status: document.getElementById('loadStatus').value,
          actor: currentUser
        })
      });
      alert("Load request saved!");
      document.getElementById('loadForm').reset();
      setTimeout(fetchLoads, 1500);
    });

    fetchLoads();
  </script>
</body>
</html>
