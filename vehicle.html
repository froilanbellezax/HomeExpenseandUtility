<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Care - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-red-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">🛵 Vehicle Care</h1>
    <button onclick="location.href='index.html'" class="bg-red-800 hover:bg-red-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Log Vehicle Service / Maintenance</h2>
      <form id="vehicleForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Vehicle / Unit</label>
            <input type="text" id="vehName" required placeholder="e.g. Motorcycle" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Service Type</label>
            <select id="vehService" class="w-full p-2.5 border rounded-xl text-sm outline-none">
              <option value="Change Oil">🛢️ Change Oil</option>
              <option value="Spark Plug / Tune-up">🔧 Tune-up</option>
              <option value="Tire / Brake Change">🛞 Tires / Brakes</option>
              <option value="Belt / Chain Maintenance">⚙️ Belt / Chain</option>
              <option value="General Repair">🛠️ General Repair</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Odometer (km)</label>
            <input type="number" id="vehOdo" required placeholder="12500" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Next Service</label>
            <input type="text" id="vehNext" placeholder="15000 km" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Cost (₱)</label>
          <input type="number" step="0.01" id="vehCost" placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Notes / Shop</label>
          <input type="text" id="vehNotes" placeholder="e.g. Shell AX7" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition">Save Maintenance Log</button>
      </form>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Service History</h3>
      <div id="vehicleList" class="space-y-2 text-sm">
        <p class="text-gray-400 text-center">Loading vehicle history...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    async function fetchVehicle() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          renderVehicle(json.data.vehicle || []);
        }
      } catch (e) { console.error(e); }
    }

    function renderVehicle(data) {
      const container = document.getElementById('vehicleList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No vehicle service logs.</p>'; return; }
      container.innerHTML = data.map(v => `
        <div class="p-3 bg-red-50/60 rounded-xl border border-red-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">${v.servicetype} <span class="text-xs text-gray-500">(${v.vehicleunit})</span></div>
            <div class="text-xs text-gray-600">Odo: <strong>${v.odometerreadingkm} km</strong> • Next: ${v.nextduekmdate || 'N/A'}</div>
            <div class="text-[10px] text-gray-400">${v.notes ? v.notes + ' • ' : ''}Logged by: ${v.loggedby}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-red-700">₱${parseFloat(v.cost || 0).toFixed(2)}</div>
            <span class="text-[10px] bg-red-100 text-red-800 px-2 py-0.5 rounded-full font-semibold">Log</span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addVehicleLog", date: new Date().toISOString().split('T')[0], vehicle: document.getElementById('vehName').value, serviceType: document.getElementById('vehService').value, odometer: document.getElementById('vehOdo').value, nextDue: document.getElementById('vehNext').value, cost: document.getElementById('vehCost').value, loggedBy: currentUser, notes: document.getElementById('vehNotes').value, actor: currentUser })
      });
      alert("Vehicle log saved!");
      document.getElementById('vehicleForm').reset();
      setTimeout(fetchVehicle, 1500);
    });

    fetchVehicle();
  </script>
</body>
</html>
