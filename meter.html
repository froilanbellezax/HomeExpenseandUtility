<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub-Meter - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-yellow-500 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">⚡ Sub-Meter Reading</h1>
    <button onclick="location.href='index.html'" class="bg-yellow-700 hover:bg-yellow-800 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Sub-Meter Reading Log</h2>
      <form id="meterForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Meter / Room Name</label>
            <input type="text" id="meterName" required value="Baking Room" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Current kWh Reading</label>
            <input type="number" step="0.1" id="meterReading" required placeholder="0.0" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold text-blue-600">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Rate (₱ / kWh)</label>
          <input type="number" step="0.1" id="meterRate" value="12" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <button type="submit" class="w-full bg-yellow-500 text-white font-bold py-3 rounded-xl hover:bg-yellow-600 transition">Log Reading</button>
      </form>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Sub-meter History</h3>
      <div id="meterList" class="space-y-2 text-sm">
        <p class="text-gray-400 text-center">Loading readings...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";
    const sessionToken = localStorage.getItem("household_hub_token") || "";

    if (!currentUser || !sessionToken) {
      window.location.href = "index.html";
    }

    function handleUnauthorized() {
      localStorage.removeItem("household_hub_user");
      localStorage.removeItem("household_hub_token");
      window.location.href = "index.html";
    }

    async function fetchMeter() {
      try {
        const res = await fetch(`${API_URL}?token=${encodeURIComponent(sessionToken)}`);
        const json = await res.json();

        if (json.status === "unauthorized") {
          handleUnauthorized();
          return;
        }

        if (json.status === "success") {
          renderMeter(json.data.submeter || []);
        }
      } catch (e) { console.error(e); }
    }

    function renderMeter(data) {
      const container = document.getElementById('meterList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No submeter readings yet.</p>'; return; }
      container.innerHTML = data.map(m => `
        <div class="p-3 bg-yellow-50 rounded-xl border border-yellow-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">${m.meternamelocation}</div>
            <div class="text-xs text-gray-500">Reading: ${m.readingkwh} kWh (Used: ${m.consumptionkwh || 0} kWh)</div>
            <div class="text-[10px] text-gray-400">Logged by: ${m.loggedby}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-yellow-700">₱${parseFloat(m.estimatedcost || 0).toFixed(2)}</div>
            <span class="text-[10px] bg-yellow-200 text-yellow-900 px-2 py-0.5 rounded-full font-semibold">Est. Cost</span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('meterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addMeterReading",
          token: sessionToken,
          date: new Date().toISOString().split('T')[0],
          meterName: document.getElementById('meterName').value,
          reading: document.getElementById('meterReading').value,
          rate: document.getElementById('meterRate').value,
          loggedBy: currentUser,
          actor: currentUser
        })
      });
      alert("Reading logged!");
      document.getElementById('meterForm').reset();
      setTimeout(fetchMeter, 1500);
    });

    fetchMeter();
  </script>
</body>
</html>
