<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot Wi-Fi Vouchers - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-cyan-700 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📶 Hotspot Wi-Fi Vouchers</h1>
    <button onclick="location.href='index.html'" class="bg-cyan-900 hover:bg-cyan-950 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <!-- Add Voucher Log Form -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Log Voucher Sale / Utang</h2>
      <form id="voucherForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Customer Name</label>
            <input type="text" id="customerName" required placeholder="e.g. Mylene" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Date</label>
            <input type="date" id="voucherDate" required class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-cyan-900">
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-500">Voucher Code / Duration</label>
          <input type="text" id="voucherCode" required placeholder="e.g. 1 Day / Code 849" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Amount (₱)</label>
            <input type="number" step="0.01" id="voucherAmount" required placeholder="200" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold text-cyan-900">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Status</label>
            <select id="voucherStatus" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
              <option value="Paid">✅ Paid</option>
              <option value="Utang">⏳ Utang</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-500">Notes (Optional)</label>
          <input type="text" id="voucherNotes" placeholder="Optional remarks" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>

        <button type="submit" class="w-full bg-cyan-700 text-white font-bold py-3 rounded-xl hover:bg-cyan-800 transition shadow-md">Save Voucher Log</button>
      </form>
    </div>

    <!-- Hotspot Voucher Logs List -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center gap-2">
        <h3 class="font-bold text-gray-700 text-xs uppercase">Hotspot Voucher Logs</h3>
        <select id="sortSelect" onchange="renderVoucherLogs()" class="text-xs border border-gray-200 rounded-lg px-2 py-1 bg-gray-50 font-semibold text-gray-700 outline-none">
          <option value="utang_date">Sort: Utang First + Newest</option>
          <option value="newest">Sort: Newest Date First</option>
          <option value="oldest">Sort: Oldest Date First</option>
          <option value="name">Sort: Customer (A–Z)</option>
        </select>
      </div>

      <div id="voucherLogsList" class="space-y-2.5 text-sm">
        <p class="text-gray-400 text-center py-2">Loading voucher logs...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "System";
    let allHotspotLogs = [];

    function setDefaultDate() {
      const dateInput = document.getElementById('voucherDate');
      if (dateInput && !dateInput.value) {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
      }
    }

    // Helper para hanapin ang value kahit bahagyang iba ang normalized header name
    function pickField(obj, candidates, fallback = "") {
      for (const key of candidates) {
        if (obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") {
          return String(obj[key]).trim();
        }
      }
      const objKeys = Object.keys(obj);
      for (const prefix of candidates) {
        const matchKey = objKeys.find(k => k.startsWith(prefix));
        if (matchKey && obj[matchKey] !== undefined && obj[matchKey] !== null && String(obj[matchKey]).trim() !== "") {
          return String(obj[matchKey]).trim();
        }
      }
      return fallback;
    }

    function parseLogDate(item) {
      const raw = pickField(item, ["date", "voucherdate", "timestamp"], "");
      const cleaned = String(raw).replace(/'/g, "").trim();
      const parsed = new Date(cleaned);
      if (!isNaN(parsed.getTime())) {
        return parsed;
      }
      return new Date(0);
    }

    function formatDisplayDate(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime()) || dateObj.getTime() === 0) {
        return "No Date";
      }
      return dateObj.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    async function fetchHotspotData() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          allHotspotLogs = json.data.hotspot || [];
          if (allHotspotLogs.length > 0) {
            console.log("Sample hotspot row keys:", allHotspotLogs[0]);
          }
          renderVoucherLogs();
        }
      } catch (e) {
        console.error("Failed to fetch hotspot logs:", e);
      }
    }

    function renderVoucherLogs() {
      const container = document.getElementById('voucherLogsList');
      const sortMode = document.getElementById('sortSelect').value;

      if (!allHotspotLogs.length) {
        container.innerHTML = '<p class="text-gray-400 text-center py-2">No voucher logs yet.</p>';
        return;
      }

      const enriched = allHotspotLogs.map(item => {
        const dt = parseLogDate(item);
        const statusStr = pickField(item, ["status"], "Paid");
        const isUtang = statusStr.toLowerCase() === 'utang' || statusStr.toLowerCase() === 'unpaid';
        const customer = pickField(item, ["customer", "customerdevice", "name"], "Customer");
        const voucher = pickField(item, ["voucher", "vouchercode", "code"], "");
        const type = pickField(item, ["type"], "Voucher");
        const loggedBy = pickField(item, ["collectedlogged", "collectedby", "loggedby", "actor"], "System");

        return {
          ...item,
          _dateObj: dt,
          _displayDate: formatDisplayDate(dt),
          _isUtang: isUtang,
          _customer: customer,
          _voucher: voucher,
          _type: type,
          _loggedBy: loggedBy
        };
      });

      enriched.sort((a, b) => {
        if (sortMode === 'utang_date') {
          if (a._isUtang !== b._isUtang) return a._isUtang ? -1 : 1;
          return b._dateObj - a._dateObj;
        }
        if (sortMode === 'newest') {
          return b._dateObj - a._dateObj;
        }
        if (sortMode === 'oldest') {
          return a._dateObj - b._dateObj;
        }
        if (sortMode === 'name') {
          const nameA = a._customer.toLowerCase();
          const nameB = b._customer.toLowerCase();
          if (nameA !== nameB) return nameA.localeCompare(nameB);
          return b._dateObj - a._dateObj;
        }
        return b._dateObj - a._dateObj;
      });

      container.innerHTML = enriched.map(item => {
        const amt = parseFloat(pickField(item, ["amount"], "0")) || 0;
        const safeCustomer = item._customer.replace(/'/g, "\\'");
        const metaLine = [item._voucher, `Logged by: ${item._loggedBy}`].filter(Boolean).join(" • ");

        return `
          <div class="p-3 ${item._isUtang ? 'bg-rose-50/60 border-rose-200' : 'bg-cyan-50/40 border-cyan-100'} rounded-xl border flex justify-between items-center gap-2">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="font-bold text-gray-900">${item._customer}</span>
                <span class="text-[10px] bg-cyan-100 text-cyan-800 px-1.5 py-0.5 rounded font-semibold">${item._type}</span>
                <span class="text-[10px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded font-semibold">📅 ${item._displayDate}</span>
              </div>
              <div class="text-xs text-gray-500 mt-0.5 truncate">${metaLine}</div>
            </div>
            <div class="text-right shrink-0 space-y-1">
              <div class="font-extrabold ${item._isUtang ? 'text-rose-700' : 'text-emerald-700'} text-sm">₱${amt.toFixed(2)}</div>
              ${item._isUtang
                ? `<button onclick="markHotspotPaid('${safeCustomer}')" class="text-[10px] bg-rose-100 hover:bg-rose-200 text-rose-800 px-2.5 py-0.5 rounded-full font-bold transition">Mark Paid</button>`
                : `<span class="inline-block text-[10px] bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full font-bold">Paid</span>`}
            </div>
          </div>
        `;
      }).join('');
    }

    async function markHotspotPaid(customerName) {
      if (!confirm(`Mark hotspot balance for ${customerName} as Paid?`)) return;
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "updateHotspotStatus",
          customer: customerName,
          actor: currentUser
        })
      });
      alert("Marked as Paid!");
      setTimeout(fetchHotspotData, 1500);
    }

    document.getElementById('voucherForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const chosenDate = document.getElementById('voucherDate').value;

      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addHotspotLog",
          type: "Voucher",
          date: chosenDate,
          customer: document.getElementById('customerName').value.trim(),
          voucher: document.getElementById('voucherCode').value.trim(),
          amount: document.getElementById('voucherAmount').value,
          status: document.getElementById('voucherStatus').value,
          collectedBy: currentUser,
          notes: document.getElementById('voucherNotes').value.trim() || "Voucher Sale",
          actor: currentUser
        })
      });

      alert("Voucher log saved!");
      document.getElementById('voucherForm').reset();
      setDefaultDate();
      setTimeout(fetchHotspotData, 1500);
    });

    setDefaultDate();
    fetchHotspotData();
  </script>
</body>
</html>
