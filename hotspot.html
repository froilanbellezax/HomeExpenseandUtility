<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot Wi-Fi - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-cyan-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📶 Hotspot Wi-Fi Sales</h1>
    <button onclick="location.href='index.html'" class="bg-cyan-800 hover:bg-cyan-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>
  
  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Log Hotspot Sale / Utang</h2>
      <form id="hotspotForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Customer / Device</label>
            <input type="text" id="hsCustomer" required placeholder="e.g. Neighbor, Mark" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Voucher / Code</label>
            <input type="text" id="hsVoucher" placeholder="e.g. 1 Day / Code 849" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Amount (₱)</label>
            <input type="number" step="1" id="hsAmount" required placeholder="e.g. 20" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Payment Status</label>
            <select id="hsStatus" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
              <option value="Paid">✅ Paid</option>
              <option value="Utang">🔴 Utang</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl hover:bg-cyan-700 transition">Save Hotspot Log</button>
      </form>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Hotspot Sales & Utang History</h3>
      <div id="hotspotList" class="space-y-2 text-sm">
        <p class="text-gray-400 text-center">Loading hotspot logs...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    async function fetchHotspot() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          renderHotspot(json.data.hotspot || []);
        }
      } catch (e) {
        console.error("Failed to load hotspot:", e);
      }
    }

    function renderHotspot(data) {
      const container = document.getElementById('hotspotList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No hotspot logs yet.</p>'; return; }
      container.innerHTML = data.map(h => `
        <div class="p-3 bg-cyan-50/60 rounded-xl border border-cyan-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">${h.customerdevicename} <span class="text-xs font-normal text-gray-500">(${h.vouchercodeforduration || 'Code'})</span></div>
            <div class="text-xs text-gray-500">Logged by: ${h.collectedloggedby}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-cyan-900">₱${parseFloat(h.amount || 0).toFixed(2)}</div>
            ${h.status === 'Utang' 
              ? `<button onclick="markHotspotPaid('${h.customerdevicename}')" class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">Mark Paid</button>`
              : `<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">Paid</span>`}
          </div>
        </div>
      `).join('');
    }

    async function markHotspotPaid(cust) {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "updateHotspotStatus", customer: cust, actor: currentUser })
      });
      alert("Marked as paid and updated Lista!");
      setTimeout(fetchHotspot, 1500);
    }

    document.getElementById('hotspotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addHotspotLog",
          customer: document.getElementById('hsCustomer').value,
          voucher: document.getElementById('hsVoucher').value,
          amount: document.getElementById('hsAmount').value,
          status: document.getElementById('hsStatus').value,
          collectedBy: currentUser,
          notes: "",
          actor: currentUser
        })
      });
      alert("Saved successfully!");
      document.getElementById('hotspotForm').reset();
      setTimeout(fetchHotspot, 1500);
    });

    fetchHotspot();
  </script>
</body>
</html>
