<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKB Splitter - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-pink-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">🍔 KKB Splitter</h1>
    <button onclick="location.href='index.html'" class="bg-pink-800 hover:bg-pink-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">KKB Splitter (With Payment Options)</h2>
      <form id="kkbForm" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-500">Total Receipt Amount (₱)</label>
          <input type="number" step="0.01" id="kkbTotal" required placeholder="0.00" oninput="calculateKKB()" class="w-full text-xl font-bold p-2.5 border rounded-xl outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Reason / Place</label>
          <input type="text" id="kkbReason" required placeholder="e.g. McDonald's, Outing" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1 block">Participants & Payments Given On-the-spot:</label>
          <div id="kkbParticipantsList" class="space-y-2 bg-gray-50 p-2.5 rounded-xl border border-gray-200 max-h-48 overflow-y-auto mb-2"></div>
          <div class="flex gap-2">
            <input type="text" id="customFriendInput" placeholder="Add custom name (e.g. Alex)" class="flex-1 p-2 border rounded-xl text-xs outline-none">
            <button type="button" onclick="addCustomParticipant()" class="bg-pink-100 text-pink-700 font-bold px-3 py-2 rounded-xl text-xs">Add</button>
          </div>
        </div>
        <div class="bg-pink-50 p-3 rounded-xl border border-pink-200 text-center">
          <span class="text-xs text-pink-700 block">Equal Share per Person:</span>
          <span id="kkbSplitResult" class="text-xl font-bold text-pink-900">₱0.00</span>
        </div>
        <button type="submit" class="w-full bg-pink-600 text-white font-bold py-3 rounded-xl hover:bg-pink-700 transition">Save & Auto-Add Unpaid Shares to Lista</button>
      </form>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";
    let cachedProfiles = [];

    async function fetchProfiles() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          cachedProfiles = json.data.profiles || [];
          populateKKBParticipants(cachedProfiles);
        }
      } catch (e) { console.error(e); }
    }

    function populateKKBParticipants(profiles) {
      const kkbContainer = document.getElementById('kkbParticipantsList');
      if (!kkbContainer) return;
      kkbContainer.innerHTML = profiles.map(p => `
        <div class="p-2 bg-white rounded-xl border border-gray-200 flex flex-col gap-1.5 kkb-row">
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-xs font-semibold text-gray-800">
              <input type="checkbox" value="${p.name}" class="kkb-check rounded text-pink-600" onchange="calculateKKB()" checked>
              <span>${p.name}</span>
            </label>
            <select class="kkb-mode text-[10px] bg-gray-100 p-1 rounded font-semibold" onchange="calculateKKB()">
              <option value="none">🔴 Unpaid (Utang)</option>
              <option value="full">✅ Paid Full</option>
              <option value="half">🌓 Paid Half</option>
              <option value="custom">💵 Custom Paid</option>
            </select>
          </div>
          <div class="hidden custom-paid-box">
            <input type="number" step="0.01" placeholder="Paid Amount (₱)" class="kkb-custom-val w-full p-1.5 border rounded-lg text-xs outline-none" oninput="calculateKKB()">
          </div>
        </div>
      `).join('');
    }

    function addCustomParticipant() {
      const input = document.getElementById('customFriendInput');
      const name = input.value.trim();
      if (!name) return;
      const kkbContainer = document.getElementById('kkbParticipantsList');
      const newDiv = document.createElement('div');
      newDiv.className = 'p-2 bg-pink-50/60 rounded-xl border border-pink-200 flex flex-col gap-1.5 kkb-row';
      newDiv.innerHTML = `
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-xs font-semibold text-pink-900">
            <input type="checkbox" value="${name}" class="kkb-check rounded text-pink-600" onchange="calculateKKB()" checked>
            <span>${name} (Guest)</span>
          </label>
          <select class="kkb-mode text-[10px] bg-white p-1 rounded font-semibold" onchange="calculateKKB()">
            <option value="none">🔴 Unpaid (Utang)</option>
            <option value="full">✅ Paid Full</option>
            <option value="half">🌓 Paid Half</option>
            <option value="custom">💵 Custom Paid</option>
          </select>
        </div>
        <div class="hidden custom-paid-box">
          <input type="number" step="0.01" placeholder="Paid Amount (₱)" class="kkb-custom-val w-full p-1.5 border rounded-lg text-xs outline-none" oninput="calculateKKB()">
        </div>
      `;
      kkbContainer.appendChild(newDiv);
      input.value = '';
      calculateKKB();
    }

    function calculateKKB() {
      const total = parseFloat(document.getElementById('kkbTotal').value) || 0;
      const rows = document.querySelectorAll('.kkb-row');
      let activeCount = 0;
      rows.forEach(r => {
        const chk = r.querySelector('.kkb-check');
        const mode = r.querySelector('.kkb-mode');
        const customBox = r.querySelector('.custom-paid-box');
        if (mode.value === 'custom') customBox.classList.remove('hidden');
        else customBox.classList.add('hidden');
        if (chk && chk.checked) activeCount++;
      });
      const perPerson = activeCount > 0 ? (total / activeCount) : 0;
      document.getElementById('kkbSplitResult').innerText = `₱${perPerson.toFixed(2)}`;
    }

    document.getElementById('kkbForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const total = parseFloat(document.getElementById('kkbTotal').value) || 0;
      const rows = document.querySelectorAll('.kkb-row');
      let activeRows = [];
      rows.forEach(r => {
        const chk = r.querySelector('.kkb-check');
        if (chk && chk.checked) {
          activeRows.push({
            person: chk.value,
            mode: r.querySelector('.kkb-mode').value,
            customVal: parseFloat(r.querySelector('.kkb-custom-val').value) || 0
          });
        }
      });
      const count = activeRows.length;
      const perPerson = count > 0 ? (total / count) : 0;
      let splits = [];
      activeRows.forEach(item => {
        let oweAmount = 0;
        if (item.mode === 'none') oweAmount = perPerson;
        else if (item.mode === 'half') oweAmount = perPerson / 2;
        else if (item.mode === 'custom') oweAmount = Math.max(0, perPerson - item.customVal);
        else if (item.mode === 'full') oweAmount = 0;
        splits.push({ person: item.person, oweAmount: oweAmount });
      });

      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "splitBill", payer: currentUser, reason: document.getElementById('kkbReason').value, splits: splits, actor: currentUser })
      });
      alert("KKB Split saved and added to Lista!");
      document.getElementById('kkbForm').reset();
      setTimeout(() => location.href='lista.html', 1500);
    });

    fetchProfiles();
  </script>
</body>
</html>
