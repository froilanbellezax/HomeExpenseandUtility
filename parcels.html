<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Parcels & Deliveries - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📦 Parcels & Deliveries</h1>
    <button onclick="location.href='index.html'" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <!-- Add Parcel Form -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Log New Parcel / Delivery</h2>
      <form id="parcelForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Recipient</label>
            <select id="parcelRecipient" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold loan-profile-select"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Courier / Store</label>
            <input type="text" id="parcelCourier" required placeholder="e.g. J&T, Shopee, Lazada" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Amount (₱)</label>
            <input type="number" step="0.01" id="parcelAmount" required placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold text-indigo-900">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Payment Status</label>
            <select id="parcelStatus" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-amber-700">
              <option value="Paid by Owner">Paid by Owner</option>
              <option value="COD Abono">COD Abono (Utang)</option>
              <option value="Paid Online">Paid Online</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Received By</label>
            <select id="parcelReceivedBy" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold loan-profile-select"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Nag-abono / Payer</label>
            <select id="parcelPayer" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-indigo-700 loan-profile-select"></select>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-gray-500">Notes / Item Description</label>
          <input type="text" id="parcelNotes" placeholder="Optional notes" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-md">Save Parcel Record</button>
      </form>
    </div>

    <!-- Parcels List -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <h3 class="font-bold text-gray-700 text-xs uppercase">📦 Deliveries Tracker</h3>
      <div id="parcelsList" class="space-y-3 text-sm">
        <p class="text-gray-400 text-center py-2">Loading parcels...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";
    const sessionToken = localStorage.getItem("household_hub_token") || "";

    if (!currentUser || !sessionToken) {
      window.location.href = "index.html";
    }

    function handleUnauthorized() {
      localStorage.removeItem("household_hub_user");
      localStorage.removeItem("household_hub_token");
      window.location.href = "index.html";
    }

    async function fetchParcelsData() {
      try {
        const res = await fetch(`${API_URL}?token=${encodeURIComponent(sessionToken)}`);
        const json = await res.json();

        if (json.status === "unauthorized") {
          handleUnauthorized();
          return;
        }

        if (json.status === "success") {
          const profiles = json.data.profiles || [];
          document.querySelectorAll('.loan-profile-select').forEach(select => {
            select.innerHTML = profiles.map(p => `<option value="${p.name}" ${p.name === currentUser ? 'selected' : ''}>${p.name}</option>`).join('');
          });
          renderParcels(json.data.parcels || []);
        }
      } catch (e) {
        console.error("Failed to load parcels:", e);
      }
    }

    function renderParcels(parcels) {
      const container = document.getElementById('parcelsList');
      if (!parcels.length) { 
        container.innerHTML = '<p class="text-gray-400 text-center py-2">No parcels logged.</p>'; 
        return; 
      }

      container.innerHTML = parcels.map(p => {
        const amt = parseFloat(p.amount || 0);
        const status = p.paymentstatus || p.status || 'Paid';
        const isAbono = String(status).toLowerCase().includes('abono');
        const payerName = p.payer || p.actualpayer || p.receivedby || 'N/A';

        return `
          <div class="p-3.5 bg-gray-50 rounded-2xl border border-gray-200 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <div class="font-bold text-gray-900">${p.courier || 'Courier'} <span class="text-xs font-normal text-gray-500">(${p.notes || 'No description'})</span></div>
                <div class="text-[11px] text-gray-500 mt-0.5">Recipient: <strong class="text-indigo-700">${p.recipient}</strong> • Received by: ${p.receivedby || 'N/A'}</div>
              </div>
              <div class="text-right">
                <div class="font-extrabold text-indigo-900 text-sm">₱${amt.toFixed(2)}</div>
                <span class="text-[10px] ${isAbono ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-700'} px-2 py-0.5 rounded-full font-bold">${status}</span>
              </div>
            </div>
            <div class="flex justify-between items-center text-[11px] pt-2 border-t border-gray-200/60">
              <span class="text-gray-500">Nag-abono/Payer: <strong class="text-gray-800 bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded border border-indigo-100">${payerName}</strong></span>
              <span class="text-gray-400">${new Date(p.timestamp || Date.now()).toLocaleDateString()}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('parcelForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addParcel",
          token: sessionToken,
          recipient: document.getElementById('parcelRecipient').value,
          courier: document.getElementById('parcelCourier').value,
          amount: document.getElementById('parcelAmount').value,
          paymentStatus: document.getElementById('parcelStatus').value,
          receivedBy: document.getElementById('parcelReceivedBy').value,
          payer: document.getElementById('parcelPayer').value,
          notes: document.getElementById('parcelNotes').value,
          actor: currentUser
        })
      });
      alert("Parcel successfully logged!");
      document.getElementById('parcelForm').reset();
      setTimeout(fetchParcelsData, 1500);
    });

    fetchParcelsData();
  </script>
</body>
</html>
