<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcels - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-orange-500 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📦 My Parcels</h1>
    <button onclick="location.href='index.html'" class="bg-orange-700 hover:bg-orange-800 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Log Delivery / Parcel</h2>
      <form id="parcelForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Courier / App</label>
            <input type="text" id="parcCourier" placeholder="Shopee/Lazada" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">COD Amount (₱)</label>
            <input type="number" step="0.01" id="parcAmount" placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Payment Status</label>
          <select id="parcStatus" class="w-full p-2.5 border rounded-xl text-sm outline-none">
            <option value="Paid by Owner">Paid by Owner</option>
            <option value="Abono Needed (Unpaid)">Abono Needed (Unpaid)</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl hover:bg-orange-600 transition">Log Delivery</button>
      </form>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Parcels History</h3>
      <div id="parcelsList" class="space-y-2 text-sm">
        <p class="text-gray-400 text-center">Loading parcels...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    async function fetchParcels() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          renderParcels(json.data.parcels || []);
        }
      } catch (e) { console.error(e); }
    }

    function renderParcels(data) {
      const container = document.getElementById('parcelsList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No parcel logs.</p>'; return; }
      container.innerHTML = data.map(p => `
        <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">For: ${p.recipient}</div>
            <div class="text-xs text-gray-500">${p.courierstore} • Rcvd by: ${p.receivedby}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-gray-900">₱${parseFloat(p.amount || 0).toFixed(2)}</div>
            <span class="text-xs font-semibold ${String(p.paymentstatus).includes('Paid') ? 'text-green-600' : 'text-red-500'}">${p.paymentstatus}</span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('parcelForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addParcel", recipient: currentUser, courier: document.getElementById('parcCourier').value, amount: document.getElementById('parcAmount').value, paymentStatus: document.getElementById('parcStatus').value, receivedBy: currentUser, notes: "", actor: currentUser })
      });
      alert("Parcel logged!");
      document.getElementById('parcelForm').reset();
      setTimeout(fetchParcels, 1500);
    });

    fetchParcels();
  </script>
</body>
</html>
