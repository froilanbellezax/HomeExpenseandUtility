<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bills & Utilities - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-indigo-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📃 Bills & Events</h1>
    <button onclick="location.href='index.html'" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Add Recurring Bill</h2>
      <form id="billForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Bill Name</label>
            <input type="text" id="billName" required placeholder="e.g. PLDT Internet" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Default Amount (₱)</label>
            <input type="number" step="0.01" id="billAmount" required placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Due Date (Day)</label>
            <input type="text" id="billDueDate" required placeholder="e.g. 25" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Responsible Person</label>
            <select id="billResponsible" class="w-full p-2.5 border rounded-xl text-sm outline-none loan-profile-select"></select>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Account Number</label>
          <input type="text" id="billAccountNo" placeholder="Optional account number" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">Save Bill</button>
      </form>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Household Bills Tracker</h3>
      <div id="billsList" class="space-y-2 text-sm">
        <p class="text-gray-400 text-center">Loading bills...</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <h2 class="font-bold text-pink-700 text-sm uppercase">🎉 Important Events & Birthdays</h2>
      <form id="eventForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Event Name</label>
            <input type="text" id="eventName" required placeholder="e.g. Mama's Birthday" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Date (MM-DD)</label>
            <input type="text" id="eventDate" required placeholder="e.g. 11-25" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Category</label>
            <select id="eventCategory" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold text-pink-700">
              <option value="🎂 Birthday">🎂 Birthday</option>
              <option value="💍 Anniversary">💍 Anniversary</option>
              <option value="⭐ Important Event">⭐ Important Event</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Notes</label>
            <input type="text" id="eventNotes" placeholder="Optional notes" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
        </div>
        <button type="submit" class="w-full bg-pink-600 text-white font-bold py-3 rounded-xl hover:bg-pink-700 transition">Save Event</button>
      </form>

      <div class="pt-2">
        <h3 class="font-semibold text-gray-700 text-xs uppercase mb-2">Upcoming Family Events</h3>
        <div id="eventsList" class="space-y-2 text-sm">
          <p class="text-gray-400 text-center">Loading events...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    async function fetchBillsData() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          const profiles = json.data.profiles || [];
          const select = document.querySelector('.loan-profile-select');
          if (select) {
            select.innerHTML = profiles.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
          }
          renderBills(json.data.recurring || []);
          renderEvents(json.data.events || []);
        }
      } catch (e) {
        console.error("Failed to load bills:", e);
      }
    }

    function renderBills(data) {
      const container = document.getElementById('billsList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No bills logged.</p>'; return; }
      container.innerHTML = data.map(b => `
        <div class="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">${b.billname} <span class="text-xs text-indigo-700 bg-indigo-100 px-1.5 py-0.5 rounded">Due: ${b.duedatedayofmonth}</span></div>
            <div class="text-xs text-gray-500">Responsible: ${b.responsibleperson}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-indigo-900">₱${parseFloat(b.amount || 0).toFixed(2)}</div>
            ${b.status === 'Paid' 
              ? `<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">Paid</span>`
              : `<button onclick="payBill('${b.billname}', ${b.amount})" class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">Mark Paid</button>`}
          </div>
        </div>
      `).join('');
    }

    function renderEvents(data) {
      const container = document.getElementById('eventsList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No events logged.</p>'; return; }
      container.innerHTML = data.map(ev => `
        <div class="p-3 bg-pink-50/50 rounded-xl border border-pink-100 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800">${ev.eventname} <span class="text-[10px] text-pink-700 bg-pink-100 px-1.5 py-0.5 rounded">${ev.category}</span></div>
            <div class="text-xs text-gray-500">${ev.notes || ''}</div>
          </div>
          <div class="text-right text-xs font-bold bg-white px-2 py-1 rounded-lg border border-pink-200 text-pink-900">${ev.date}</div>
        </div>
      `).join('');
    }

    async function payBill(billName, defaultAmt) {
      const input = prompt(`Magkano ang binayaran para sa "${billName}" ngayong buwan?`, defaultAmt);
      if (input === null) return;
      const amount = parseFloat(input);
      if (isNaN(amount)) { alert("Invalid amount!"); return; }

      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "updateBillStatus", billName: billName, amount: amount, status: "Paid", actor: currentUser })
      });
      alert("Bill updated!");
      setTimeout(fetchBillsData, 1500);
    }

    document.getElementById('billForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addRecurringBill",
          billName: document.getElementById('billName').value,
          amount: document.getElementById('billAmount').value,
          dueDate: document.getElementById('billDueDate').value,
          responsible: document.getElementById('billResponsible').value,
          accountNo: document.getElementById('billAccountNo').value,
          actor: currentUser
        })
      });
      alert("Bill saved!");
      document.getElementById('billForm').reset();
      setTimeout(fetchBillsData, 1500);
    });

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addImportantEvent",
          eventName: document.getElementById('eventName').value,
          date: document.getElementById('eventDate').value,
          category: document.getElementById('eventCategory').value,
          notes: document.getElementById('eventNotes').value,
          actor: currentUser
        })
      });
      alert("Event saved!");
      document.getElementById('eventForm').reset();
      setTimeout(fetchBillsData, 1500);
    });

    fetchBillsData();
  </script>
</body>
</html>
