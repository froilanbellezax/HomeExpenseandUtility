<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Vault - BelPan House Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10 max-w-md mx-auto min-h-screen flex flex-col relative">
  <header class="bg-purple-600 text-white p-4 shadow-md rounded-b-2xl mb-3 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">📋 Lista Vault</h1>
    <button onclick="location.href='index.html'" class="bg-purple-800 hover:bg-purple-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Menu</button>
  </header>

  <main class="px-4 flex-1 space-y-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase">Record Utang / Sisingilin</h2>
      <form id="debtForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Person / Customer</label>
            <input type="text" id="debtPerson" required placeholder="e.g. Mark, Friend" class="w-full p-2.5 border rounded-xl text-sm outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Type / Direction</label>
            <select id="debtDir" class="w-full p-2.5 border rounded-xl text-sm outline-none font-semibold">
              <option value="Pautang (Sisingilin)">🟢 Pautang (Sisingilin)</option>
              <option value="Utang (Babayaran)">🔴 Utang (Babayaran)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Amount (₱)</label>
          <input type="number" step="0.01" id="debtAmount" required placeholder="0.00" class="w-full p-2.5 border rounded-xl text-sm outline-none font-bold">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Reason / Details</label>
          <input type="text" id="debtNotes" placeholder="e.g. McDo split, emergency load" class="w-full p-2.5 border rounded-xl text-sm outline-none">
        </div>
        <button type="submit" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl hover:bg-purple-700 transition">Save to Lista</button>
      </form>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="font-semibold text-gray-700 text-xs uppercase mb-3">Active Lista Vault</h3>
      <div id="debtsList" class="space-y-2 text-sm">
        <p class="text-gray-400 text-center">Loading listahan...</p>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwxJzrBW2rV2xQuxMQf-xdhlqP4xRVn1O4aZktGkuA8rEICsFQemGne2_0ecc3gh-V7/exec";
    const currentUser = localStorage.getItem("household_hub_user") || "";

    async function fetchDebts() {
      try {
        const res = await fetch(`${API_URL}?user=${encodeURIComponent(currentUser)}`);
        const json = await res.json();
        if (json.status === "success") {
          renderDebts(json.data.debts || []);
        }
      } catch (e) {
        console.error("Failed to load debts:", e);
      }
    }

    function renderDebts(data) {
      const container = document.getElementById('debtsList');
      if (!data.length) { container.innerHTML = '<p class="text-gray-400 text-center">No active listahan logs.</p>'; return; }
      container.innerHTML = data.map(d => {
        const personName = d.borrowerperson || d.person || 'Unknown';
        const direction = d.direction || 'Utang';
        const notes = d.reasonnotes || d.notes || 'No details';
        const amt = parseFloat(d.amount || 0).toFixed(2);
        const isSettled = String(d.status) === 'Settled';

        return `
          <div class="p-3 bg-purple-50/60 rounded-xl border border-purple-100 flex justify-between items-center">
            <div>
              <div class="font-bold text-gray-800">${personName} <span class="text-[10px] text-purple-700 bg-purple-100 px-1.5 py-0.5 rounded font-semibold">${direction}</span></div>
              <div class="text-xs text-gray-500">${notes} • By: ${d.loggedby || ''}</div>
            </div>
            <div class="text-right">
              <div class="font-bold text-purple-900">₱${amt}</div>
              ${!isSettled 
                ? `<button onclick="markDebtSettled('${personName}', '${notes}')" class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">Mark Settled</button>`
                : `<span class="text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-bold">Settled</span>`}
            </div>
          </div>
        `;
      }).join('');
    }

    async function markDebtSettled(person, notes) {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "updateDebtStatus", person: person, notes: notes, actor: currentUser })
      });
      alert("Marked as settled!");
      setTimeout(fetchDebts, 1500);
    }

    document.getElementById('debtForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addDebt",
          person: document.getElementById('debtPerson').value,
          direction: document.getElementById('debtDir').value,
          amount: document.getElementById('debtAmount').value,
          loggedBy: currentUser,
          notes: document.getElementById('debtNotes').value,
          actor: currentUser
        })
      });
      alert("Saved to Lista!");
      document.getElementById('debtForm').reset();
      setTimeout(fetchDebts, 1500);
    });

    fetchDebts();
  </script>
</body>
</html>
